<script>
const UNITELER = [{"t":"Ateizm, Materyalizm ve Pozitivizm","intro":"Tanrı'yı inkâr eden ateizm ve çeşitleri; her şeyi maddeye indirgeyen materyalizm; bilgiyi deney ve tecrübeyle sınırlayan pozitivizm ve Comte'un 3 hal yasası.","s":[{"h":"Ateizm","b":[{"k":"d","t":"Ateizm","x":"Yunancada “Tanrı” anlamına gelen “theos” kelimesinin başına olumsuzluk eki olan “a” getirilerek oluşturulmuş bir terkip olup “Tanrı inancı olmayan veya herhangi bir tanrıya inanmayı reddeden kişi, tanrıtanımaz.” anlamına gelir."},{"k":"p","x":"Hristiyanlığın ve özellikle kilisenin bilime ve bilim adamına yönelik ortaya koyduğu baskıcı tutuma karşı tepkisel bir hareket olarak ortaya çıkmıştır. Kökeni antik çağa dayanır."},{"k":"h","x":"Ateizmin çeşitleri"},{"k":"d","t":"Mutlak ateizm","x":"İnsanda doğuştan Tanrı fikrinin olmadığını savunmaktır."},{"k":"dikkat","x":"Halbuki her insanın varlığının derinliklerinde bir yerde Tanrı fikri saklıdır. Mutlu ve sağlıklı günlerinde Tanrı'yı inkâr eden bir ateistin, dara düştüğünde Tanrı'ya sığınması bunun bir delilidir."},{"k":"d","t":"Teorik ateizm","x":"Tanrı'nın varlığının bilinçli bir şekilde reddedilmesidir."},{"k":"p","x":"Ateizm denilince akla gelen türü de budur. Burada Tanrı'nın varlığının düşünerek, tartışarak, deliller üreterek inkâr edilmesi söz konusudur."},{"k":"d","t":"Pratik / fiilî ateizm","x":"Teoride Tanrı'yı kabul etmediği gibi pratikte de Tanrı'yı hayatına sokmamaktır."},{"k":"d","t":"İlgisizlerin ateizmi","x":"Tanrı'nın varlığı tartışmalarına ilgisiz kalmaktır."},{"k":"tbl","r":[["Çeşit","Özü"],["**1. Mutlak ateizm**","İnsanda doğuştan Tanrı fikri yoktur."],["**2. Teorik ateizm**","Tanrı'nın varlığı bilinçli olarak, düşünerek ve delil üreterek reddedilir."],["**3. Pratik / fiilî ateizm**","Teoride de pratikte de Tanrı hayata sokulmaz."],["**4. İlgisizlerin ateizmi**","Tanrı'nın varlığı tartışmalarına ilgisiz kalınır."]]}]},{"h":"Materyalizm","b":[{"k":"d","t":"Materyalizm","x":"Maddeyi ezelî ve ebedî kabul edip var olan her şeyin maddeden ibaret olduğunu ileri süren ve doğa ötesi bir alanı (metafizik) kabul etmeyen; Allah'ı, âhiret gününü ve diğer inanç esaslarından pek çoğunu reddeden eğilimlerin genel adıdır."},{"k":"p","x":"Kökeni antik çağa dayanır."},{"k":"p","x":"Evrendeki düzen fikrini reddeden bu anlayış, tabiatta olup bitenleri tesadüflerle, kâinattaki değişimi ise evrim ile açıklayarak sonraları ortaya çıkacak evrimci anlayışlara ilham kaynağı olmuştur. Başlangıçtaki ilk ve yaratılmamış maddeyi, büyük patlama (big bang) ile izah etseler de bu patlamaya neyin yol açtığı sorusunu cevaplamakta bir hayli zorlanmışlardır."},{"k":"not","x":"Maddenin temel yapıtaşı olarak atom/cevherin merkeze alınması anlayışı İslâm düşünürlerinde de mevcutsa da buradaki cevher yaratılmamış ve değişmeyen bir asıl değil, aksine maddenin tamamı gibi değişken ve dolayısıyla yaratılmıştır."},{"k":"tbl","r":[["","Materyalizm","İslâm düşünürleri"],["**Atom / cevher**","Yaratılmamış, ezelî ve değişmeyen asıl","Maddenin tamamı gibi değişken, dolayısıyla yaratılmış"]]},{"k":"dikkat","x":"Materyalizmde ezelî bir maddenin varlığı -ki bu tesadüfidir- ve her çeşit canlı faaliyetin kaynağı olduğu tezi hiçbir bilimsel araştırma tarafından doğrulanabilmiş değildir. Tam tersine bilim dünyasının ortaya atıp tartıştığı büyük patlama, genişleyen evren görüşleri ve termodinamiğin yasaları, âlemin yaratılmış olduğu tezini destekler mahiyettedir. Çünkü eğer madde, büyük patlama sonucu ortaya çıktı ve ondan önce mevcut değil ise, bu durumda onun ezelî olabilmesi de mümkün değildir."}]},{"h":"Pozitivizm","b":[{"k":"d","t":"Pozitivizm","x":"Bilginin kaynağını yalnızca deney ve tecrübe ile sınırlayan, metafiziksel bilgiyi kabul etmeyen felsefî akımdır."},{"k":"not","x":"Bize göre bilginin kaynağı akıl, his ve haber-i sadıktır."},{"k":"p","x":"Bu terimi ilk kullanan **Saint Simon**, sistematik hâle getiren ise **August Comte**'tur. Olgu ve deneye dayanan pozitif felsefeyi, insanın ulaşabileceği son merhale olarak gören Comte, bunu 3 hal yasasıyla açıklar:"},{"k":"h","x":"Comte'un 3 hal yasası"},{"k":"steps","x":["**Mitolojik / Teolojik:** Bu aşamada insan bütün olguların doğaüstü güçlerin bir sonucu olduğunu düşünür. Bu aşamada insanlık çocukluk dönemindedir. Dünyanın 1300 yılına kadar olan dönemine hâkimdir.","**Metafizik:** Bu aşamada insan olguların nedeninin doğa gibi soyut güçler olduğuna inanır. Bu aşamada insanlık gençlik/ergenlik dönemindedir. Dünyanın 1300-1800 yıllarını kapsar.","**Pozitif / Bilimsel:** Bu aşamada olgular, deney ve tecrübeye dayandırılır. Bu aşamada insanlık olgunluk dönemindedir. Dünya 1800'den itibaren bu aşamaya girmiştir."]},{"k":"ornek","x":"Bu aşamaları şöyle örneklendirebiliriz: 1. Aşama: Yağmuru tanrı yağdırdı, 2. Aşama: Doğa yağdırdı, 3. Aşama: Su, buhar, bulut vs..."},{"k":"tbl","r":[["Aşama","Olguların nedeni","İnsanlığın dönemi","Tarih","Yağmur örneği"],["**1. Mitolojik / Teolojik**","Doğaüstü güçler","Çocukluk","1300'e kadar","Tanrı yağdırdı"],["**2. Metafizik**","Doğa gibi soyut güçler","Gençlik / ergenlik","1300-1800","Doğa yağdırdı"],["**3. Pozitif / Bilimsel**","Deney ve tecrübe","Olgunluk","1800'den itibaren","Su, buhar, bulut"]]},{"k":"p","x":"İnsanlık bu 3. aşamaya ulaştığında artık dinlerin çağı kapanacak, Mitolojinin yerini Bilim / Vahyin yerini Akıl / Mucizenin yerini ilmî keşif / Mabedin yerini Üniversite alacaktır."},{"k":"tbl","r":[["Pozitivizme göre kapanacak olan","Yerini alacak olan"],["**Mitoloji**","Bilim"],["**Vahiy**","Akıl"],["**Mucize**","İlmî keşif"],["**Mabed**","Üniversite"]]},{"k":"h","x":"Pozitivizmin eleştirisi"},{"k":"dikkat","x":"Günümüzde bilim ve teknoloji zirve yapmasına rağmen dinlerin varlığını sürdürdüğü reddedilemez bir gerçektir."},{"k":"dikkat","x":"Ayrıca bu düşüncenin bilgi tanımı efradını câmi değildir. Çünkü varlığından emin olduğumuz ancak tecrübe ile doğrulayamadığımız \"akıl\" gibi olgular vardır."},{"k":"dikkat","x":"Aynı şekilde bu düşünceye göre din ve bilim iki zıttır ve bir arada bulunamaz. Oysaki din ve bilim birbirine karşı değildir. Her ikisinin de hedefinde hakikat vardır, fakat bu hakikate farklı yöntemlerle ulaşırlar. Bunun yanında din ve bilimin uyuştuğu birçok husus vardır."}]}],"ht":[{"s":0,"x":"Ateizm: \"theos\" (Tanrı) + olumsuzluk eki \"a\" → tanrıtanımaz. Kilisenin bilime baskısına tepki olarak doğdu; kökeni antik çağa dayanır."},{"s":0,"x":"Ateizmin 4 çeşidi: mutlak, teorik (asıl akla gelen), pratik/fiilî, ilgisizlerin ateizmi."},{"s":0,"x":"Mutlak ateizme cevap: dara düşen ateistin Tanrı'ya sığınması, Tanrı fikrinin doğuştan olduğunun delilidir."},{"s":1,"x":"Materyalizm: madde ezelî ve ebedîdir, her şey maddeden ibarettir, metafizik yoktur. Düzeni tesadüfle, değişimi evrimle açıklar; evrimci anlayışlara ilham verdi."},{"s":1,"x":"Materyalizme cevap: büyük patlama, genişleyen evren ve termodinamik yasaları âlemin yaratıldığını destekler; madde patlamayla ortaya çıktıysa ezelî olamaz."},{"s":1,"x":"İslâm düşünürlerindeki cevher yaratılmış ve değişkendir."},{"s":2,"x":"Pozitivizm: bilginin kaynağı yalnızca deney ve tecrübedir; metafizik bilgi yoktur. Bize göre bilginin kaynağı akıl, his ve haber-i sadıktır."},{"s":2,"x":"Terimi ilk kullanan Saint Simon; sistematik hâle getiren August Comte."},{"s":2,"x":"3 hal yasası: mitolojik/teolojik (çocukluk, 1300'e kadar) → metafizik (gençlik, 1300-1800) → pozitif/bilimsel (olgunluk, 1800'den sonra)."},{"s":2,"x":"Pozitivizme cevap: dinler bilim çağında da sürüyor; tanım efradını câmi değil (akıl tecrübeyle doğrulanamaz); din ve bilim zıt değil, ikisi de hakikati hedefler."}]},{"t":"Septisizm, Satanizm, Agnostisizm ve Nihilizm","intro":"Her bilgiden kuşku duyan septisizm; şeytana tapan ya da onu sembol edinen satanizm; Tanrı'nın bilinemeyeceğini söyleyen agnostisizm; her şeyi anlamsız sayan nihilizm.","s":[{"h":"Septisizm","b":[{"k":"d","t":"Septisizm","x":"Dolaylı olarak ateizm ile ilişkilendirilen kavramlardan biri olan ve “kuşkuculuk” anlamına gelen septisizm: Varlık ve olayların gerçekliği ve niteliğiyle ilgili bilgilerin her zaman kuşkulu olacağını ileri süren akım; her türlü bilgiden şüphe edip onu eleştirmeyi ilke edinen felsefî tutumdur."},{"k":"p","x":"Septikler, açık biçimde Tanrı'nın varlığını inkâr etmeseler de kendilerini kuşku durumundan kurtaramadıkları ve imanın netlik ve berraklığına erişemedikleri için ateist olarak görülebilirler."},{"k":"p","x":"İlk temsilcileri **Pyrrhon** ve **Protagoras**'tır. Bunlar, bilgiye şüpheyle yaklaşır, hiçbir şeyin kesin olarak bilinemeyeceği düşüncesini savunurlar."},{"k":"dikkat","x":"Bu yaklaşım, ince bir araştırma ve tahkike yol açması noktasında belli oranda olumlu görülebilse de bu kuşkuyu sürekli kılmaları ve bütün bilgi kaynaklarından şüphe duyacak kadar köklü hâle getirmeleri gerçekle bağdaşmayan bir durumdur."},{"k":"h","x":"İslâm kelamcılarına göre"},{"k":"p","x":"İslâm kelamcılarına göre, dışarıda bizden bağımsız bir gerçeklik dünyası mevcuttur ve ona ilişkin bilginin imkânından söz etmek de mümkündür."},{"k":"p","x":"Diğer taraftan, eşyanın hakikatinin ve ona ilişkin bilginin inkârı, bizi bütün yargılarımızdan ve işlerimizden vazgeçmeye götürür ki, bu insan hayatının devamlılığını riske sokan bir durumdur. Çünkü yaşamak için hareket etmek, çalışmak, gayret etmek zorunda olduğumuza göre, yaptığımız işleri bilmek, onlar arasından daha iyi olanı seçmek ve o konuda bir karara varabilmemiz zorunludur."}]},{"h":"Satanizm","b":[{"k":"d","t":"Satanizm","x":"Şeytana tapan ya da onunla ilişkilendirilen bir düşünce sistemini ifade etmek için kullanılır."},{"k":"p","x":"Bu düşünceyi benimseyenlere **Satanist** denir."},{"k":"h","x":"Satanist gruplar"},{"k":"p","x":"Satanist gruplar genel olarak ikiye ayrılır:"},{"k":"d","t":"Geleneksel Satanistler","x":"Şeytana gerçek anlamda tapan, büyü ve ritüellerle ibadet eden gruplardır."},{"k":"p","x":"Bu tür Satanizm, genellikle kara büyü uygulamaları, kurban ritüelleri ve şeytani figürlere tapınmayı içerir. Eski Avrupa'da ve günümüzde bazı marjinal gruplar tarafından uygulanmaktadır."},{"k":"d","t":"Modern Satanistler","x":"Bu grup, şeytanı gerçek bir varlık olarak kabul etmek yerine, onu özgürlük ve bireysel gelişimin bir sembolü olarak görür."},{"k":"p","x":"**LaVeyan Satanizm** olarak da bilinen bu akım, bireycilik ve özgürlük, ateizm ve doğacılık, haz ve iç güdülerin kabulü prensiplerini benimser. Bu sistemin içinde 9 İlke ve 9 Günah yer alır…"},{"k":"tbl","r":[["","Geleneksel Satanistler","Modern Satanistler"],["**Şeytan**","Gerçek anlamda tapılan varlık","Gerçek varlık değil; özgürlük ve bireysel gelişimin sembolü"],["**Uygulama**","Büyü, ritüel, kara büyü, kurban, şeytani figürlere tapınma","Bireycilik ve özgürlük, ateizm ve doğacılık, haz ve iç güdülerin kabulü"],["**Diğer adı / yeri**","Eski Avrupa ve günümüzde bazı marjinal gruplar","LaVeyan Satanizm; 9 İlke ve 9 Günah"]]},{"k":"h","x":"Satanizmin dinlerle ilişkisi"},{"k":"p","x":"Satanizm, İslam, Hristiyanlık ve Yahudilik gibi tek tanrılı dinlerle keskin bir zıtlık içindedir. Bu dinlerde şeytan, insanın en büyük düşmanı olarak görülmekte ve ona tapmanın sapkınlık olduğu vurgulanmaktadır."},{"k":"p","x":"İslam'a göre şeytan, insanları doğru yoldan saptıran bir varlıktır ve Allah tarafından lanetlenmiştir. Hristiyanlık'ta da şeytan, kötülüğün temsilcisi olarak görülmüş ve ona tapanlar aforoz edilmiştir."},{"k":"p","x":"Ancak bazı Satanist gruplar, kendilerini Hristiyan öğretilerine bir tepki olarak konumlandırarak, şeytanı özgürlüğün ve bağımsızlığın simgesi olarak kabul etmiştir."}]},{"h":"Agnostisizm","b":[{"k":"d","t":"Agnostisizm","x":"İnsan aklının Tanrı ve evren hakkındaki mutlak gerçeği bilemeyeceğini ileri süren felsefe akımıdır."},{"k":"p","x":"Yunanca “bilgi ve mârifet” anlamına gelen gnostos sözcüğünün başına olumsuzluk eki olan “a” ekinin gelmesiyle oluşan bir kelime olup “bilinemezci” anlamına gelir ve ilk defa İngiliz filozof **Huxley** tarafından bu yöndeki öğretisini isimlendirmek için kullanılmıştır. Mahiyet itibariyle kuşkuculuğun bir uzantısı olarak da görülebilir."},{"k":"p","x":"Agnostiklere göre Tanrı ve metafizik dünya, bilginin sınırları içinde yer almamaktadır. Bu sebeple inananların savundukları şekilde Tanrı'nın varlığını bilmek de veya ateistlerin benimsedikleri şekliyle O'nun yokluğunu bilmek veya reddetmek de mümkün değildir."},{"k":"h","x":"İslâm düşünce tarihinde"},{"k":"p","x":"İslâm düşünce tarihinde bu türden akımları ifade etmek için **indiyye**, **inâdiyye** ve **lâ edriyye** gibi isimler verilmiştir. Bunların tamamını **sûfestâiyye** başlığı altında toplamak mümkündür."},{"k":"p","x":"Bu düşüncenin izlerine uzak doğunun **Sümeniyye** ve **Berâhime** gibi akımlarında da rastlamak mümkündür."},{"k":"tbl","r":[["","İnanan","Ateist","Agnostik"],["**Tanrı hakkında**","Tanrı'nın varlığını bilir","Tanrı'nın yokluğunu bilir / reddeder","Ne varlığı ne yokluğu bilinebilir"]]}]},{"h":"Nihilizm","b":[{"k":"d","t":"Nihilizm","x":"İnsan varoluşunun nesnel bir anlam veya amacının olmadığını, bir yaratıcının veya yöneticinin bulunmadığını, bilginin imkânsızlığını ve gerçek bir ahlakın olmadığını savunan bir düşünce sistemidir."},{"k":"p","x":"Latince “hiç” anlamına gelen “nihil”den türemiştir. Kelime olarak “hiççilik” manasındadır."},{"k":"p","x":"Nihilistlere göre yaşam hiçbir gerçekliğe sahip değildir ve var olan her şey temelsiz olduğu için belirli bir değere sahip değildir. Gerçek de dahil olmak üzere her şey yararsızdır. Kendi iyiliği uğruna veya bir başkasının iyiliği maksadıyla ahlaki ilkeleri savunmak için hiçbir neden yoktur. Nihilistlere göre her şey anlamsızdır, buna üretilen nesneler, yaratılan doğa ve insanlar da dahildir."},{"k":"h","x":"Nihilizmin tarihçesi"},{"k":"steps","x":["Bu kavram, ilk defa 19. yy'ın başlarında **Friedrich Jacobi** tarafından kullanılmıştır.","Rus yazar **Ivan Turgenev**, romanında (1862) nihilist karakter Bazarov'u kullanmasıyla popüler hâle gelmiştir.","Nihilizmi geniş anlamda anlaşılır ve belirli bir mantık çerçevesine oturtulabilir hâle getirmeye çalışan kişi **Nietzsche**'dir. Kendisi pek çok dini ve ahlaki değerleri yok sayıp yerine “üstün insan”ı getirmiştir."]}]}],"ht":[{"s":0,"x":"Septisizm: kuşkuculuk; her bilgiden şüphe edip eleştirmeyi ilke edinir. Tanrı'yı açıkça inkâr etmese de imanın berraklığına erişemediği için ateist görülebilir."},{"s":0,"x":"Septisizmin ilk temsilcileri: Pyrrhon ve Protagoras."},{"s":0,"x":"Kuşku tahkike yol açtığı ölçüde olumlu; sürekli ve köklü hâle gelince gerçekle bağdaşmaz."},{"s":0,"x":"Kelamcılara göre bizden bağımsız bir gerçeklik vardır ve bilgisi mümkündür; bilgiyi inkâr hayatın devamlılığını riske sokar."},{"s":1,"x":"Satanizm ikiye ayrılır: geleneksel (şeytana gerçekten tapar; büyü, ritüel, kurban) ve modern / LaVeyan (şeytan özgürlük sembolü; 9 İlke ve 9 Günah)."},{"s":1,"x":"Satanizm tek tanrılı dinlerle keskin zıtlık içindedir; İslam'da şeytan lanetlenmiş, Hristiyanlıkta kötülüğün temsilcisidir."},{"s":2,"x":"Agnostisizm: \"gnostos\" (bilgi) + \"a\" → bilinemezci. Terimi ilk kullanan İngiliz filozof Huxley; kuşkuculuğun bir uzantısıdır."},{"s":2,"x":"Agnostiklere göre Tanrı'nın ne varlığı ne yokluğu bilinebilir."},{"s":2,"x":"İslâm düşüncesinde karşılıkları: indiyye, inâdiyye, lâ edriyye → hepsi sûfestâiyye başlığı altında. Uzak doğuda izleri: Sümeniyye ve Berâhime."},{"s":3,"x":"Nihilizm: \"nihil\" (hiç) → hiççilik. Varoluşun anlamı, yaratıcı, bilgi ve gerçek ahlak yoktur; her şey anlamsızdır."},{"s":3,"x":"Nihilizm: ilk kullanan Friedrich Jacobi (19. yy başı) → Turgenev'in romanıyla (1862, Bazarov) popüler → Nietzsche mantık çerçevesine oturttu, yerine \"üstün insan\"ı koydu."}]},{"t":"Evrimcilik ve Deizm","intro":"Türlerin ortak atadan doğal seçilimle değiştiğini iddia eden evrimcilik ve İslâm'daki tekâmül anlayışı; Tanrı'yı kabul edip vahyi reddeden deizm.","s":[{"h":"Evrimcilik","b":[{"k":"d","t":"Evrimcilik","x":"Bütün canlı türlerinin doğal seçilim yoluyla ortak ata sayesinde değişime uğradığını iddia eden akımdır."},{"k":"d","t":"Doğal seçilim","x":"Canlıların dış yapı farklılıklarından ötürü hayatta kalma şansının ve üreme başarısının değişkenlik göstermesidir."},{"k":"d","t":"Ortak ata","x":"Evrimsel süreçte, birden fazla canlı türünün ortak genetik öncülü olan ilk canlı, varlık."},{"k":"dikkat","x":"Bu ortak ata tesadüfen var olmuştur. Bu yönüyle evrimcilik materyalizmle aynıdır. Çünkü onlara göre de ezelî ve ebedî olan ilk varlık, tesadüfen ortaya çıkmıştır. Böylece her iki akımın tezleri de çürümüş oluyor."},{"k":"p","x":"Evrim teorisi, tüm yaşam türlerinin milyonlarca yılda meydana gelen kademeli değişimler sonucu ortaya çıktığını öne sürer. Buna göre insan, çeşitli aşamalardan geçerek insana dönüşmüştür."},{"k":"p","x":"**Darwin** tarafından 19. yy.'ın ortalarında geliştirilip sistemleştirilmiştir."},{"k":"h","x":"Kur'ân'a göre yaratılış ve tekâmül"},{"k":"p","x":"Kur'ân-ı Kerîm'e göre canlı ve cansız bütün varlıklar, Allah'ın yoktan yaratmasıyla meydana gelmiştir ve Allah her varlığın yapısına mükemmele doğru bir eğilim yerleştirmiştir. Buna İslâm düşünürleri “tekâmül” adını vermişlerdir."},{"k":"d","t":"Tekâmül","x":"Bir canlının kendi iç bünyesinde kemale doğru ilerlemesini ifade eder."},{"k":"p","x":"Ancak bu tekâmül düşüncesinde, her varlığın kendine özgü bir yaratılış biçimi ve sureti mevcut olup, türler arası geçiş asla söz konusu değildir. Zaten “tekâmül” kelimesi sözlük anlamı itibariyle türler arası geçişi mümkün kılacak bir evrimi asla ifade etmez."},{"k":"ornek","x":"Bir incir çekirdeğinin, incir ağacına dönüşmesi ve bir kromozomun tekâmül ederek belli şartlar dahilinde insana dönüşmesi, birer tekâmül olup, asla evrim değildir."},{"k":"tbl","r":[["","Evrim","Tekâmül"],["**Başlangıç**","Tesadüfen var olmuş ortak ata","Allah'ın yoktan yaratması"],["**Değişim**","Doğal seçilimle türler arası geçiş","Canlının kendi iç bünyesinde kemale doğru ilerlemesi"],["**Türler arası geçiş**","Var","Asla söz konusu değil"],["**Örnek**","İnsanın çeşitli aşamalardan geçerek insana dönüşmesi","İncir çekirdeğinin incir ağacına dönüşmesi"]]},{"k":"dikkat","x":"Bir canlının diğer canlının evrimi sonucu meydana geldiğini iddia edebilmek için bu konuda somut bir misale ihtiyaç vardır. Oysaki yapılan hiçbir araştırmada böyle bir örneğe rastlanmamıştır."}]},{"h":"Deizm","b":[{"k":"d","t":"Deizm","x":"Din, peygamber veya vahiy aracı olmaksızın bireyin akıl, gözlem, sezgi gibi yollarla Tanrı'nın varlığına inanmasına dayalı bir felsefi görüştür."},{"k":"p","x":"Deizm (ilahiyye/ilahçılık), Latince Tanrı anlamındaki \"deus\" sözcüğünden türetilerek ateizme karşı tanrıcılık anlamında kullanılmıştır."},{"k":"p","x":"Bir başka ifadeyle Allah'ın âlemin mimarı olduğunu, âlemi düzenleyip tanzim ettiğini, ona şekil verdiğini, onu harekete geçirdiğini, fakat artık âleme karışmadığını tasavvur eden bir anlayıştır."},{"k":"tbl","r":[["","Ateizm","Deizm"],["**Kökü**","\"theos\" + olumsuzluk eki \"a\"","Latince \"deus\""],["**Tanrı**","İnkâr edilir","Akıl, gözlem, sezgiyle kabul edilir"],["**Din, peygamber, vahiy**","—","Aracı olarak kabul edilmez"],["**Âlemle ilişki**","—","Âlemi yaratıp düzenledi, artık karışmıyor"]]}]}],"ht":[{"s":0,"x":"Evrimcilik: bütün türler doğal seçilim yoluyla ortak atadan değişime uğramıştır. Darwin 19. yy ortasında sistemleştirdi."},{"s":0,"x":"Ortak ata tesadüfen var olmuştur; bu yönüyle evrimcilik materyalizmle aynıdır."},{"s":0,"x":"Tekâmül: canlının kendi iç bünyesinde kemale ilerlemesi (incir çekirdeği → incir ağacı); türler arası geçiş yoktur, evrim değildir."},{"s":0,"x":"Evrime cevap: türler arası geçişe dair somut bir örneğe hiçbir araştırmada rastlanmamıştır."},{"s":1,"x":"Deizm (ilahiyye / ilahçılık): \"deus\"tan; din, peygamber ve vahiy olmadan akıl, gözlem ve sezgiyle Tanrı'ya inanmak."},{"s":1,"x":"Deizme göre Allah âlemin mimarıdır, onu düzenleyip harekete geçirmiştir ama artık âleme karışmaz."}]},{"t":"Kötülük Problemi","intro":"Kötülüğün tanımı ve ateizmin kötülük argümanı; doğal, ahlaki ve metafiziksel kötülük; kelam ekollerinin doğal ve ahlaki kötülüğe bakışı.","s":[{"h":"Kötülük ve kötülük problemi","b":[{"k":"d","t":"Kötülük","x":"İyinin karşıtı olan, beğenilmemeye ve kınanmaya konu olan; hür iradenin reddettiği ve kendisinden kurtulmaya çalıştığı her şeydir."},{"k":"p","x":"Kötülük Problemi, Ateizmin temel argümanlarından biridir. Ateist kötülük ile tanrının varlığı arasında bir çelişki görür."},{"k":"steps","x":["Ona göre merhametli ve her şeye gücü yeten bir tanrı kötülüğe izin vermez.","Dolayısıyla böyle bir tanrının bulunması hâlinde kötülük olmamalıdır.","Bu varsayımın kaçınılmaz sonucu “kötülük varsa o hâlde Tanrı yoktur” şeklinde olacaktır."]}]},{"h":"Kötülüğün kısımları","b":[{"k":"p","x":"Kötülük iki kısımdır:"},{"k":"d","t":"Doğal / fiziksel kötülük","x":"Hastalık yapan bakteriler, depremler, fırtınalar, kasırgalar, kuraklıklar ve benzeri durumlarda insan eylemlerinden bağımsız olarak meydana gelen kötülükler bu gruptan sayılır."},{"k":"d","t":"Ahlaki kötülük","x":"Acımasızlık, adaletsizlik, aldatma, kıskançlık, savaş, soykırım, yalan, zulüm vb. insan kaynaklı kötülüklerdir."},{"k":"p","x":"Daha sonra **Leibniz**, bunlara **metafiziksel kötülüğü** yani: “Yaratılmış evrenin sonluluğu ve sınırlılığı” kısmını eklemiştir."},{"k":"d","t":"Metafiziksel kötülük","x":"Yaratılmış evrenin sonluluğu ve sınırlılığı."},{"k":"tbl","r":[["Kötülük","Kaynağı","Örnekler"],["**Doğal / fiziksel**","İnsan eylemlerinden bağımsız","Bakteriler, depremler, fırtınalar, kasırgalar, kuraklıklar"],["**Ahlaki**","İnsan kaynaklı","Acımasızlık, adaletsizlik, aldatma, kıskançlık, savaş, soykırım, yalan, zulüm"],["**Metafiziksel** (Leibniz ekledi)","Yaratılmış olmak","Evrenin sonluluğu ve sınırlılığı"]]}]},{"h":"Kelam ekollerinin görüşleri","b":[{"k":"h","x":"Doğal kötülük"},{"k":"p","x":"**Ehl-i Sünnet** kelamcıları doğal kötülük olgusuna hikmet ve imtihan çerçevesinden bakarlar. Onlara göre Allah isteseydi hiçbir kötülüğün bulunmadığı bir dünya yaratabilirdi. Nitekim Cennet böyle bir yerdir. Ama O hikmeti gereği bu dünyayı bir imtihan alanı kılmış, bunun doğal bir sonucu olarak da orada birtakım kötülüklerin bulunmasına izin vermiştir."},{"k":"p","x":"**Mutezile** ise bunu “salah” kavramıyla açıklarlar. Dolayısıyla bize kötü gibi görünen şeyler -her ne kadar farkında olmasak da- aslında iyidir."},{"k":"tbl","r":[["","Ehl-i Sünnet","Mutezile"],["**Doğal kötülüğe bakış**","Hikmet ve imtihan","“Salah” kavramı"],["**Açıklama**","Allah kötülüksüz bir dünya (Cennet gibi) yaratabilirdi; dünyayı imtihan alanı kıldı","Bize kötü görünenler, farkında olmasak da aslında iyidir"]]},{"k":"h","x":"Ahlaki kötülük"},{"k":"p","x":"**Mutezile**'ye göre insan, hem iyi ve kötüyü, güzel ve çirkini, doğru ve yanlışı ayırt edebilecek bir temyiz melekesine sahiptir hem de o kendi fiillerinin yaratıcısı, yani doğrudan failidir. Bu yüzden tüm ahlaki kötülüklerin kaynağı, özgürce eyleme yönelen insanın kendisidir."},{"k":"p","x":"**Eşarîlere** göre iyi olsun kötü olsun tüm fiillerin yaratıcısı Allah'tır. Fakat kötü fiiller Allah'ın yaratması yönüyle değil, kulun kesbi nedeniyle kötülük vasfını kazanır. Yani halk-ı şer şer değil, kesb-i şer şerdir."},{"k":"p","x":"**Mâtürîdîlere** göre de iyi olsun kötü olsun tüm fiillerin yaratıcısı Allah'tır. Ancak onlar, Allah'ın fiilleri irade etmesini, sadece onları yaratmayı irade etmesi olarak anlarlar."},{"k":"not","x":"Her ikisinde de önce insan fiile yönelir, sonra Allah onun yöneldiği bu fiili irade eder ve yaratır."},{"k":"tbl","r":[["Ekol","Fiillerin yaratıcısı","Ahlaki kötülüğün kaynağı"],["**Mutezile**","İnsan (fiillerinin doğrudan faili)","Özgürce eyleme yönelen insanın kendisi"],["**Eş'arîler**","Allah","Kulun kesbi (halk-ı şer şer değil, kesb-i şer şerdir)"],["**Mâtürîdîler**","Allah","Allah yalnızca yaratmayı irade eder; önce insan fiile yönelir"]]}]}],"ht":[{"s":0,"x":"Kötülük: iyinin karşıtı; kınanan, hür iradenin reddettiği ve kurtulmaya çalıştığı her şey."},{"s":0,"x":"Kötülük problemi ateizmin temel argümanıdır: merhametli ve kadir bir tanrı kötülüğe izin vermez → kötülük varsa Tanrı yoktur."},{"s":1,"x":"Kötülük iki kısımdır: doğal/fiziksel (insandan bağımsız: deprem, kuraklık) ve ahlaki (insan kaynaklı: zulüm, savaş). Leibniz üçüncü olarak metafiziksel kötülüğü (evrenin sonluluğu ve sınırlılığı) ekledi."},{"s":2,"x":"Doğal kötülük: Ehl-i Sünnet → hikmet ve imtihan (Allah kötülüksüz dünya yaratabilirdi, Cennet gibi). Mutezile → \"salah\": kötü görünen aslında iyidir."},{"s":2,"x":"Ahlaki kötülük: Mutezile → insan fiillerinin yaratıcısıdır, kötülüğün kaynağı insandır. Eş'arî → yaratan Allah, kötülük kulun kesbinden: \"halk-ı şer şer değil, kesb-i şer şerdir.\""},{"s":2,"x":"Mâtürîdî → yaratan Allah; Allah'ın iradesi yaratmayı irade etmektir. Eş'arî ve Mâtürîdî'de önce insan fiile yönelir, sonra Allah irade edip yaratır."}]},{"t":"İntihar ve Ötanazi","intro":"İntiharın tanımı ve sebepleri; intiharı önlemede dinin rolü; intihar edenin eceli, ötanazi, kader ve sorumluluk; intihar saldırıları.","s":[{"h":"İntihar ve sebepleri","b":[{"k":"d","t":"İntihar","x":"Bir insanın, neticesinin ölüm olacağının bilincinde olarak, kendisinin ölümüne yol açacak bir eylem yapmasıdır."},{"k":"h","x":"Sebepleri"},{"k":"p","x":"İntihar vakaları incelendiğinde intiharın, başarısızlık, tatminsizlik, beklentilerin karşılanamaması gibi sebeplere dayalı olarak ortaya çıkabildiği gibi, yalnızlık, terk edilmişlik, aile içi veya aile dışı bireylerle yaşanan sorunlar ve duygusal bozuklukların da insanları bunalıma ittiği ve bazı durumlarda da intihara götürdüğü görülmektedir."},{"k":"not","x":"Aslında insanları intihara sürükleyen sebeplerin başında **depresyon/bunalım** gelmektedir. Çünkü sosyal tecritten, ailelerde yaşanan boşanma durumlarının oluşturduğu travmaların yol açtığı yalnızlık ve itilmişlik durumuna kadar pek çok vaka, insanları bunalıma götüren süreç içinde yer almaktadır."},{"k":"p","x":"Alkol ve uyuşturucunun oluşturduğu yalnızlık duygusu, aile içi ayrılıkların körüklediği ilgisizlik, evlilik sorunları, anne baba ile yaşanan sorunlar ve sevdiği biri tarafından terk edilme gibi durumlar, insanı boşluğa ve bunalıma götüren sebepler arasında ön sırada yer alır."}]},{"h":"İntiharı önlemede dinin rolü","b":[{"k":"n","n":1,"x":"İslâm dinine göre hayat kutsaldır. Buna göre intihar kesin bir şekilde yasaklanmıştır. Ve büyük günahlardandır."},{"k":"n","n":2,"x":"İntihar, çaresizliğin veya acının bir sonucudur. Ancak kendisinin imtihan için dünyaya gönderildiğine inanan kişi, inancı gereği daima Allah'a güvenir ve şartlar ne olursa olsun Allah'tan ümidini kesmez ve sabreder."},{"k":"n","n":3,"x":"Dinimiz, dünyada yaşanan sıkıntıların, varsa büyük küçük günahlarımıza kefaret olduğunu ve çekilen sıkıntıların mutlaka ahirette bir karşılığının olduğunu vurgulayarak insan hayatını anlamlandırmıştır."},{"k":"n","n":4,"x":"İnsanlara yaşama sevinci veren ve karşılaştığı zorluklarla başa çıkma gücü veren faktörlerden biri de kader inancıdır. Her türlü çabasına rağmen gücünün yetmediği durumlarda, bu durumunu arz edebileceği yüce bir yaratıcıya sığınmak ve onunla baş başa kalmak insana huzur verir ve sıkıntılarını unutturur."}]},{"h":"İntihar eden eceliyle mi ölmüştür?","b":[{"k":"p","x":"**Ehl-i sünnet** âlimlerine göre ölen herkes kendi eceliyle ölmüştür. Ölüm şeklinin intihar veya başka bir şekilde olması bunu değiştirmez."},{"k":"p","x":"**Mutezile**'ye göre ise eceliyle ölmemiştir. Kendini öldürmeseydi ölmeyecekti."},{"k":"tbl","r":[["","Ehl-i sünnet","Mutezile"],["**İntihar eden eceliyle mi öldü?**","Evet; ölen herkes kendi eceliyle ölür","Hayır; kendini öldürmeseydi ölmeyecekti"]]}]},{"h":"Ötanazi","b":[{"k":"d","t":"Aktif ötanazi","x":"Hastaya ölümcül bir doz enjekte edilmesidir."},{"k":"d","t":"Pasif ötanazi","x":"Hastanın hayatta kalmasını sağlayan müdahaleleri yapmamaktır."},{"k":"p","x":"Ötanazi, Türkçede çoğu kere “ölme hakkı” anlamında kısaltılarak kullanılmaktadır. Bu işlem, hastanın acılarına son vermek için enjeksiyon yaparak, yüksek dozda ilâç vererek veya yaşam destek ünitesine bağlı olarak yaşayan hastayı bundan ayırarak gerçekleştirilmektedir."},{"k":"dikkat","x":"Bu her iki türüyle de caiz değildir. Çünkü eğer hastanın rızasıyla olursa intihar, aksi hâlde de cinayet olur."},{"k":"tbl","r":[["Ötanazi","Hastanın rızasıyla","Rızası olmadan"],["**Hükmü**","İntihar","Cinayet"]]}]},{"h":"İntihar kaderde varsa intihar eden kişi niçin günahkâr oluyor?","b":[{"k":"p","x":"Çünkü intihar eden kişi, zaten kaderinde var olan ölüm fiilini (intiharı) icra ettiği için değil, aksine Allah'ın yasakladığı bir biçimde kendi ölümüne yol açtığı için sorumludur ve büyük günah işlemiş sayılır. Yani kul, kendi tercihi nedeniyle günahkâr sayılır."}]},{"h":"İntihar saldırıları câiz midir?","b":[{"k":"p","x":"Dinimize göre malını, canını, namusunu, vatanını, ülkesini ve bayrağını korumak için mücadele etmek meşru olmakla birlikte, meşru bir hedefe ulaştıran yolların da meşru olması gerekir. Bu gaye ile savaş meydanlarında yiğitçe mücadele edenler övülmüştür."},{"k":"dikkat","x":"Ancak üzerine bağladığı bombaları patlatmak suretiyle sivil-asker ayırımı gözetmeksizin gerçekleştirilen eylemler, Müslüman şahsiyetine yakışmayan bir mücadele yöntemidir ve dinimizin temel felsefesiyle bağdaşmamaktadır."}]}],"ht":[{"s":0,"x":"İntihar: neticesinin ölüm olacağını bilerek kendi ölümüne yol açacak bir eylem yapmak."},{"s":0,"x":"Sebepler: başarısızlık, tatminsizlik, yalnızlık, terk edilmişlik, aile sorunları, alkol ve uyuşturucu… Başta gelen sebep depresyon/bunalımdır."},{"s":1,"x":"Dinin rolü (4): hayat kutsaldır, intihar büyük günahtır · imtihan inancı Allah'a güven ve sabır verir · sıkıntılar günahlara kefaret ve ahirette karşılıklıdır · kader inancı yaşama sevinci ve huzur verir."},{"s":2,"x":"İntihar edenin eceli: Ehl-i sünnet → eceliyle ölmüştür (ölüm şekli değiştirmez). Mutezile → eceliyle ölmemiştir."},{"s":3,"x":"Ötanazi (\"ölme hakkı\"): aktif → ölümcül doz enjekte etmek; pasif → hayatta tutan müdahaleleri yapmamak. İki türü de caiz değildir: rızayla olursa intihar, rızasız olursa cinayettir."},{"s":4,"x":"İntihar eden, kaderdeki ölümü icra ettiği için değil, Allah'ın yasakladığı biçimde kendi ölümüne yol açtığı için sorumludur; kul kendi tercihi nedeniyle günahkârdır."},{"s":5,"x":"İntihar saldırıları: meşru hedefe ulaştıran yollar da meşru olmalıdır; sivil-asker ayırmadan bomba patlatmak Müslüman şahsiyetine yakışmaz, dinin temel felsefesiyle bağdaşmaz."}]},{"t":"Fetret Ehli","intro":"Fetret kavramı ve fetret ehli; ehl-i fetretin âhiretteki durumuna dair dört görüş; Gazzâlî'ye göre Peygamber'in davetini duymayanların üç sınıfı.","s":[{"h":"Fetret kavramı ve fetret ehli","b":[{"k":"d","t":"Fetret","x":"Geçerli herhangi bir dinî öğretinin veya davetin kendisine ulaşmadığı kimselerdir."},{"k":"p","x":"Özellikle Hz. İsa ve Hz. Muhammed arasında geçen zaman için kullanılır. Ancak Hz. Muhammed'den sonra bu durumda olan kimseleri de kapsamaktadır."}]},{"h":"Mezheplerin görüşleri","b":[{"k":"p","x":"Ehl-i fetretin durumu ile alakalı ulema genel olarak 4 görüşe gitmiştir:"},{"k":"n","n":1,"x":"Ahirette imtihana tâbi tutulup neticesine göre gidecekleri yer belli olacaktır. (**İbn Teymiyye**)"},{"k":"n","n":2,"x":"Onlar ehl-i necâttır (cennetliktir). (**Eş'arî**)"},{"k":"n","n":3,"x":"Akıllarını kullanıp tek olan yaratıcıyı bulurlarsa cennetlik, aksi hâlde cehennemliktir. (**Mâtürîdî**)"},{"k":"n","n":4,"x":"Ne cehenneme ne de cennete gideceklerdir. Kul hakları ödendikten sonra toprak olacaklardır. (**İmam Rabbânî**)"},{"k":"tbl","r":[["Görüş sahibi","Ehl-i fetretin durumu"],["**İbn Teymiyye**","Ahirette imtihan edilir, neticeye göre yeri belli olur."],["**Eş'arî**","Ehl-i necâttır (cennetliktir)."],["**Mâtürîdî**","Aklıyla tek yaratıcıyı bulursa cennetlik, bulmazsa cehennemlik."],["**İmam Rabbânî**","Ne cennet ne cehennem; kul hakları ödendikten sonra toprak olur."]]},{"k":"dikkat","x":"Eş'arî ile Mâtürîdî burada ayrılır: Eş'arî'ye göre fetret ehli doğrudan kurtuluşa erer; Mâtürîdî'ye göre aklını kullanıp tek yaratıcıyı bulmakla yükümlüdür."}]},{"h":"Gazzâlî'ye göre davetini duymayanlar","b":[{"k":"p","x":"Peygamberimizin (s.a.v.) gönderilmesinden sonra, davetini duymayanlarla ilgili olarak İmam **Gazzâlî**'nin insanları üç sınıfta incelediğini görmekteyiz:"},{"k":"n","n":1,"x":"Peygamberin (a.s.m.) davetini duymamış, kendisinden haberdar da olmamıştır. Bu sınıfa giren insanlar kesin olarak ehl-i necat olup Cennetliktir."},{"k":"n","n":2,"x":"Peygamberin (a.s.m.) davetini, gösterdiği mucizeleri ve güzel ahlâkını duymuş olmakla beraber îman etmemiştir. Bu sınıf kesin olarak azaba uğratılacaktır."},{"k":"n","n":3,"x":"Peygamberin (a.s.m.) ismini duydukları hâlde, aleyhinde yapılan menfî propagandalardan başka bir şey duymadıklarından, kimse onlara doğruyu söyleyip onları teşvik etmediğinden alâka duymamaktadırlar. Bunların da ehl-i necat olacaklarını, yani Cennete gireceklerini umarım."},{"k":"tbl","r":[["Sınıf","Durumu","Hükmü"],["**1**","Davetini duymamış, haberdar da olmamış","Kesin olarak ehl-i necat, cennetlik"],["**2**","Davetini, mucizelerini ve ahlâkını duymuş ama iman etmemiş","Kesin olarak azaba uğratılacak"],["**3**","Yalnızca ismini ve aleyhindeki menfî propagandayı duymuş","Ehl-i necat olmaları umulur"]]}]}],"ht":[{"s":0,"x":"Fetret ehli: geçerli bir dinî öğreti veya davetin ulaşmadığı kimseler. Özellikle Hz. İsa ile Hz. Muhammed arası; Hz. Muhammed'den sonra bu durumda olanları da kapsar."},{"s":1,"x":"Ehl-i fetret (4 görüş): İbn Teymiyye → ahirette imtihan; Eş'arî → ehl-i necât (cennetlik); Mâtürîdî → aklıyla yaratıcıyı bulursa cennetlik; İmam Rabbânî → kul hakları ödenip toprak olur."},{"s":2,"x":"Gazzâlî'nin üç sınıfı: hiç duymayan → kesin cennetlik; davet, mucize ve ahlâkını duyup iman etmeyen → kesin azap; yalnız ismini ve menfî propagandayı duyan → kurtuluşları umulur."}]},{"t":"Ruh, Cinler ve Reenkarnasyon","intro":"Ruh çağırma, astral seyahat, tayy-i zaman ve tayy-i mekân, telepati, telekinezi ve ruh eşi; cinlerin varlığı ve insanlarla ilişkisi; reenkarnasyon ve âhiret inancı.","s":[{"h":"Ruh","b":[{"k":"p","x":"Âlimlerin çoğunluğuna göre ruh yaratılmıştır ve görünmezdir."},{"k":"h","x":"Ruhları çağırmak mümkün müdür?"},{"k":"p","x":"İslâm dünyasında “ilmü istihzâri'l-ervâh” ve “ilmü'l-azâim” tabirleriyle dile getirilen ruh çağırma, Osmanlı literatüründe **huddâmcılık** olarak isimlendirilmiştir."},{"k":"dikkat","x":"Âyet ve hadislerden ve nakledilen bazı rivayetlerden peygamberlerin meleklerle ve bazı kâhinlerin de cinlerle teması olduğundan söz edilse de ölen insanların ruhlarıyla temas kurulduğu veya onların bazı yöntemlerle çağrıldığına ilişkin bir rivayet bulunmamaktadır."}]},{"h":"İslam'da astral seyahat var mı? Tayy-i zaman ve tayy-i mekân","b":[{"k":"d","t":"Astral seyahat","x":"Uyku hâlinde veya uyanıkken ruhun bedenden ayrılarak başka yerlere yolculuk etmesi."},{"k":"p","x":"Astral seyahat, büyü ve sihir yoluyla doğaya hâkim olma eğiliminde olan teosofik/okültist inançlardan biridir."},{"k":"p","x":"Astral seyahatin, İslâm Tasavvuf literatürü içinde yer alan “tayy-i zaman” ve “tayy-i mekân” kavramlarıyla ilişkili olabileceği ilk bakışta akla gelse de hakikatte bir ilgisi bulunmamaktadır."},{"k":"p","x":"Arapçada dürülmek anlamına gelen “tayy” kelimesinin zaman ve mekân kavramlarıyla oluşturduğu birer terkip olan bu kavramlar, bir anlamda zaman ve mekân sınırlarını aşmayı ifade eder."},{"k":"d","t":"Tayy-i zaman ve tayy-i mekân","x":"Allah'ın sevgili kullarına bahşettiği kerametlerden biri olup, Allah'ın onlara bir anlık bir zaman diliminde uzun mesafeler kat ettirmesi."},{"k":"not","x":"Buradaki eylem hem ruhen hem de bedenen gerçekleşir."},{"k":"p","x":"Kur'an'da tayy-i zaman ve tayy-i mekân kavramlarına dinî mesnet bulmak mümkün görünüyor."},{"k":"ornek","x":"Ashâb-ı Kehf ve Hz. Süleyman'ın yanındaki kişi."},{"k":"tbl","r":[["","Astral seyahat","Tayy-i zaman ve tayy-i mekân"],["**Kaynağı**","Teosofik / okültist inanç","Tasavvuf literatürü; Allah'ın sevgili kullarına kerameti"],["**Gerçekleşmesi**","Ruh bedenden ayrılarak yolculuk eder","Hem ruhen hem bedenen"],["**Dinî mesnet**","—","Kur'an'da var (Ashâb-ı Kehf, Hz. Süleyman'ın yanındaki kişi)"]]}]},{"h":"Telepati, telekinezi, ruh eşi","b":[{"k":"h","x":"Telepati"},{"k":"d","t":"Telepati","x":"Bir olayın önceden insanın içine doğması ve kişinin başkalarının hislerini sezebilmesi durumudur."},{"k":"p","x":"Ruhla ilgili parapsikolojik olaylardan olan telepati, Yunanca “uzaktan” anlamına gelen **tele** kelimesiyle “duygu” anlamına gelen **pathos** kelimelerinden türetilmiştir."},{"k":"dikkat","x":"İnsandaki bu hissin her zaman doğru olacağını var saymak, ona göre gündelik hayatını şekillendirmek doğru değildir. Çünkü insandaki bu ilham/önsezi, meleklerden olabileceği gibi şeytanın telkinlerinden de kaynaklanabilir. Her zaman doğru olabilmesinin bir garantisi yoktur. Bu sebeple bu tarz önsezilere mutlak olarak güvenmek ve onu bir inanç hâline dönüştürmek doğru değildir."},{"k":"h","x":"Telekinezi"},{"k":"d","t":"Telekinezi","x":"Düşünce gücüyle birtakım nesneleri hareket ettirebilme gücü."},{"k":"dikkat","x":"İslam'da böyle bir şey yoktur. En iyi niyetle dua ile yapılmıştır desek bile Allah (c.c.), duaları kabul etmek mecburiyetinde değildir."},{"k":"h","x":"Ruh eşi veya ruh ikizi"},{"k":"dikkat","x":"İslam'da böyle bir şey yoktur."}]},{"h":"Cinler","b":[{"k":"d","t":"Cin","x":"Duyularla idrak edilemeyen, insanlar gibi şuur ve iradesi bulunan, ilâhî emirlere muhatap, dolayısıyla kâfir ve müminleri bulunabilen ateşten yaratılmış bir varlık türü."},{"k":"p","x":"Sözlükte “örtmek, gizlemek, gizli kalmak” anlamlarına gelen ve duyu organları tarafından algılanamayan örtülü ve gizli şey anlamına gelen cin, bu varlık türünü isimlendirmek için kullanılan bir terimdir."},{"k":"dikkat","x":"Cinlerin varlığı, Kur'an, Sünnet ve İcmâ ile sabittir. Dolayısıyla hiçbir Müslüman'ın cinlerin varlığını inkâr etmesi câiz olmaz."},{"k":"sc","q":"Cinler insanlara zarar verebilirler mi?","x":"Cinlerin insanlara fiziksel anlamda zarar verdiği, onları hasta ettiği ve günlük kullanımdaki deyimiyle “insanları çarptığına” ilişkin açık bir anlatım bulunmamaktadır. Ancak Kur'an-ı Kerim, Nâs suresinde, insanların kalplerine vesvese veren şeytandan Allah'a sığınmamızı istemektedir."},{"k":"sc","q":"Cinler görülebilir mi?","x":"Ehl-i sünnete göre, cinler görülebilir. Çünkü görülebilmenin yegâne şartı “vücut” (var olmak)tır. Var olan her şey görülebilir. Cinler de var olduğuna göre görülebilmeleri mümkündür."},{"k":"sc","q":"Cinlere kendi cinsinden peygamber gelmiş midir?","x":"Allah-u Teâlâ cinler topluluğuna da insanlarda olduğu gibi kendi cinslerinden peygamberler göndermiştir. Hz. Peygamber (s.a.v.) hem insanların hem de cinlerin peygamberidir. Hatta bundan dolayı kendisine “resûlü's-sakaleyn” (cinlerin ve insanların peygamberi) unvanı verilmiştir. Bu, Hz. Peygambere (s.a.v.) özgü bir şeydir."},{"k":"d","t":"Resûlü's-sakaleyn","x":"Cinlerin ve insanların peygamberi; Hz. Peygamber'e (s.a.v.) özgü unvan."},{"k":"sc","q":"Cinlerden faydalanılır mı?","x":"Cinler, latif varlıklar olduğundan, onları aslî suretleriyle görmek ve iletişim kurabilmek mümkün değildir. İnsanların, cinlerin maddeye bürünen bu suretleriyle iletişim kurmaları ya da görüşebilmeleri mümkün görünmektedir. Hz. Süleyman dışında diğer peygamberlerin de cinleri hizmetinde çalıştırdığına ilişkin herhangi bir rivayet mevcut değildir."}]},{"h":"Reenkarnasyon","b":[{"k":"d","t":"Reenkarnasyon","x":"İnsanın öldükten sonra yeni bir bedenle dünyaya dönmesidir."},{"k":"p","x":"Tenâsüh veya ruh göçü de denmiştir. Kökü, Hint dinleridir. Bu düşüncenin temel nedeni, insanın ölümsüzlük arzusudur."},{"k":"dikkat","x":"Reenkarnasyon inancının kabulü, İslâm âhiret inancının inkârı anlamına gelmektedir. Çünkü reenkarnasyonda bütün süreç, bedende başlamakta ve yine bir başka bedende son bulmaktadır; insanın mükâfatı hak etmesi ya da cezaya mâruz kalması için bir âhirete gerek bulunmamaktadır."}]}],"ht":[{"s":0,"x":"Âlimlerin çoğuna göre ruh yaratılmıştır ve görünmezdir."},{"s":0,"x":"Ruh çağırma: İslâm dünyasında \"ilmü istihzâri'l-ervâh\" ve \"ilmü'l-azâim\", Osmanlı'da huddâmcılık. Ölülerin ruhlarının çağrıldığına dair rivayet yoktur."},{"s":1,"x":"Astral seyahat: ruhun bedenden ayrılıp yolculuk etmesi; teosofik/okültist bir inanç."},{"s":1,"x":"Tayy-i zaman ve tayy-i mekân (\"tayy\" = dürülmek): Allah'ın sevgili kullarına kerameti; bir anda uzun mesafe kat ettirmesi. Ruhen ve bedenen olur; Kur'an'da mesnedi var (Ashâb-ı Kehf, Hz. Süleyman'ın yanındaki kişi). Astral seyahatle ilgisi yoktur."},{"s":2,"x":"Telepati: \"tele\" (uzaktan) + \"pathos\" (duygu); önsezi. Melekten de şeytandan da olabilir; mutlak güvenilmez, inanç hâline getirilmez."},{"s":2,"x":"Telekinezi: düşünce gücüyle nesne hareket ettirmek. İslam'da yoktur; dua deseniz bile Allah duaları kabul etmek mecburiyetinde değildir."},{"s":2,"x":"Ruh eşi / ruh ikizi: İslam'da yoktur."},{"s":3,"x":"Cin: duyularla idrak edilemeyen, şuur ve iradesi olan, ilâhî emirlere muhatap, ateşten yaratılmış varlık. Varlığı Kur'an, Sünnet ve İcmâ ile sabittir; inkârı câiz olmaz."},{"s":3,"x":"Cinlerin insanları \"çarptığına\" dair açık anlatım yoktur; Nâs suresi vesveseden Allah'a sığınmayı emreder."},{"s":3,"x":"Ehl-i sünnete göre cinler görülebilir: görülmenin tek şartı var olmaktır."},{"s":3,"x":"Hz. Peygamber \"resûlü's-sakaleyn\"dir (cinlerin ve insanların peygamberi); bu ona özgüdür."},{"s":3,"x":"Cinlerle aslî suretlerinde iletişim mümkün değil; maddeye büründükleri suretle mümkün görünür. Cinleri hizmetinde çalıştıran yalnızca Hz. Süleyman'dır."},{"s":4,"x":"Reenkarnasyon (tenâsüh, ruh göçü): ölen insanın yeni bir bedenle dünyaya dönmesi. Kökü Hint dinleri; nedeni ölümsüzlük arzusu."},{"s":4,"x":"Reenkarnasyonu kabul âhireti inkâr demektir: mükâfat ve ceza bedenden bedene geçişte olur, âhirete gerek kalmaz."}]},{"t":"Okültist Eğilimler","intro":"Gizli saklı olanın bilgisi iddiası: falcılık, kehanet, medyumluk, astroloji ve burçlar, sihir ve büyü, yoga, reiki, aura-çakra ve şifacılık.","s":[{"h":"Okültizm","b":[{"k":"d","t":"Okültizm","x":"Genel olarak “gizli saklı olanın bilgisi” anlamındadır."},{"k":"tbl","r":[["Uygulama","Ne yapar?","Hükmü"],["**Falcılık**","Kâğıt, kahve telvesi gibi şeylerden gelecekten haber verir","İnanıp hayatını ona göre şekillendiren Hz. Peygamber'i inkâr etmiş sayılır"],["**Kehanet**","Gaybı ve geleceği bildiğini iddia eder","Kâhinlerin bilgileri çoğu kere aldatıcıdır"],["**Medyumluk**","Ölülerin ruhlarıyla aracılık iddiasıyla geçmişten haber verir","İnsan ruhu çağrılabilir bir varlık değildir"],["**Astroloji ve burçlar**","Gök cisimlerinden günlük hayat ve gelecek tahmini","Bir fal çeşididir (yıldız falı); yasaklanmıştır"],["**Sihir ve büyü**","Bir şeyi olduğundan farklı gösterip aldatır","Yasak; gerçekliği kelamcıların çoğuna göre var, bazılarına göre yok"]]}]},{"h":"Falcılık","b":[{"k":"d","t":"Falcılık","x":"Oyun kâğıtları, kahve telvesi gibi şeylere bakarak gelecekten haber verme veya anlam çıkarma, yorum yapma işidir."},{"k":"dikkat","x":"Fal vb. uygulamalara inanıp ona göre hayatını şekillendirenlerin Hz. Peygamber'i (s.a.v.) inkâr etmiş sayılacakları, namazlarının kabul edilmeyeceği hadislerde vurgulanmıştır."}]},{"h":"Kehanet ve kâhinlik","b":[{"k":"d","t":"Kâhin","x":"Gaybî meseleleri ve olayların iç yüzünü bildiğini iddia eden ve gelecekte olacak şeyleri haber veren kişi."},{"k":"d","t":"Kehanet","x":"Kâhinin yaptığı iş."},{"k":"not","x":"Kur'an'a göre kâhinlerin verdiği bilgiler çoğu kere hakikate uygun değil, aldatıcıdır."}]},{"h":"Medyumluk","b":[{"k":"p","x":"Medyum, Latincede “aracı” anlamındadır. Ölülerle diriler arasında bir nevi aracılık yaptıklarını iddia ettikleri için bu ismi almışlardır."},{"k":"d","t":"Medyum","x":"Ölülerle diriler arasında bir nevi aracılık yaptığını iddia eden kişi."},{"k":"p","x":"Günümüzde, kâhinlerin yerini medyumlar almıştır. Medyumlar geçmişten haber verirler. Haber kaynakları iddialarına göre ölen kişilerin ruhlarıdır."},{"k":"dikkat","x":"İnsan ruhu çağrılabilir ve istenildiği zaman iletişim kurulabilir nitelikte bir varlık değildir."},{"k":"tbl","r":[["","Kâhin","Medyum"],["**Haber verdiği**","Gelecek","Geçmiş"],["**İddia ettiği kaynak**","Gaybı ve olayların iç yüzünü bilmek","Ölen kişilerin ruhları"]]}]},{"h":"Astroloji ve burçlar","b":[{"k":"d","t":"Astroloji","x":"Gök cisimlerinin konumu ve hareketlerinden yola çıkarak insanların günlük yaşamı ve hatta geleceği hakkında tahminlerde bulunmaktır."},{"k":"p","x":"Aslında daha önce değindiğimiz fal türlerinden birisidir ve falın bu çeşidine **“yıldız falı”** adı verilmektedir."},{"k":"dikkat","x":"Bugün günümüz insanının burç diye takip ettiği ve gazete köşelerinden bulup gündelik hayatını ona göre düzenlediği şeyin de bir çeşit fal olduğunu söylemek mümkündür. Bu da dinimizce yasaklanmıştır."}]},{"h":"Sihir ve büyücülük","b":[{"k":"d","t":"Sihir ve büyü","x":"El çabukluğu, süslü sözler ve göz boyama teknikleriyle bir şeyi olduğundan farklı gösterip insanları aldatma."},{"k":"not","x":"Türkçede genellikle aynı anlamda kullanılan bu iki kelimeden aslında büyü, bir sihir türüdür. Dolayısıyla sihir büyüden daha genel bir kavramdır."},{"k":"p","x":"Kelam âlimlerinin çoğu sihir ve büyünün dinimizce yasaklanmış olsa da onun bir gerçekliğinin olduğunu kabul edip insanlar üzerinde etkisi olabileceğini ifade etmişlerdir."},{"k":"p","x":"Ancak bazı kelam âlimleri de sihir ve büyüye herhangi bir gerçeklik atfetmemekte, aksine onu göz boyama, yalan, aldatma ve hileden ibaret görmektedirler."},{"k":"tbl","r":[["","Kelamcıların çoğu","Bazı kelamcılar"],["**Sihrin gerçekliği**","Vardır, insanlar üzerinde etkisi olabilir","Yoktur; göz boyama, yalan, aldatma ve hiledir"],["**Hükmü**","Yasak","Yasak"]]}]},{"h":"Yoga","b":[{"k":"d","t":"Yoga","x":"Bedensel hareketlerin kontrolü ve meditasyon yardımıyla kurtuluşa erme yolu."},{"k":"p","x":"Bununla, bireyin olgunlaşması ve arınması hedeflenir."},{"k":"p","x":"Sanskrit dilinde yoga kelimesi pek çok anlama sahiptir; \"kontrol etmek\", \"boyunduruk altına almak\" veya \"birleştirmek\" anlamına gelen Sanskrit **\"yuj\"** kelimesinden türemiştir. \"Kavuşma\", \"bir araya gelme\", \"birlik\", \"karşılaşma\" ve \"yöntem\" olarak çevrilebilir. Yoga uygulayan veya yoga felsefesini takip eden kişiye **yogi** ya da **yogini** adı verilir. Yogini ifadesi \"yogi\" isminin dişil kullanımıdır."},{"k":"p","x":"Yoganın doğum tarihi tam olarak bilinmese de, doğum yeri Hindistan, babası olarak da **Patanjali** ismi zikredilir. Hinduizm'in altı büyük öğretisinden biri olarak bilinir."},{"k":"not","x":"Müslüman bireyin yoga ve benzeri çağdaş uygulamalarla bir başka dinin propagandasına alet olmadan da kendini eğitmesi, arındırması ve mutlak dinginliğe erişmesi mümkündür."},{"k":"p","x":"İslâm dininde bütün sonlu ufukların ötesinde olan yüce bir varlığa inanma yanında, öngörülen namaz, oruç, zekât, hac vb. ibadetlerin temel amacı da insanı eğitmek, olgunlaştırmak, dünya ve âhiret mutluluğunu kazandırmaktır. Karşılaşılan sıkıntılar ve musibetler karşısında, her şeyi yaratan ve her şeye gücü yeten Allah'a sığınmadan daha rahatlatıcı ne olabilir ki? Ayrıca yapılan istiğfarlar, gerçekleştirilen ibadetler ve duaların birey ve toplum huzuruna artı değer katacağı da gözden uzak tutulamaz."}]},{"h":"Reiki, aura-çakra uygulamaları ve şifacılık","b":[{"k":"d","t":"Reiki","x":"Enerji aktarımı ile ruhsal şifa vermeye dayalı olduğuna inanılan bir teknik."},{"k":"p","x":"Rei “her yerde var olan”, Ki “ruhsal yaşam enerjisi” anlamına gelmektedir. Kaynağının Tibet olduğu sanılan Reiki, 19. yüzyılda bir Japon Budist olan **Dr. Mikao Usui** tarafından ortaya çıkarılmış ve elleri kullanmak suretiyle bir şifa tekniği hâlinde sunulmuştur."},{"k":"d","t":"Aura","x":"Bir kişinin, canlının veya nesnenin etrafında olduğuna inanılan, genellikle görünmeyen ancak bazı kişiler tarafından hissedilebilen veya algılanabilen enerji alanı."},{"k":"d","t":"Çakra","x":"Bedendeki 7 önemli enerji merkezi."},{"k":"p","x":"İnsan vücudunda bu enerjiye açık çakralar (bedendeki 7 önemli enerji merkezleri) vardır. Reiki yöntemiyle kaybedilen enerji yeniden vücuda kazandırılmaktadır."},{"k":"dikkat","x":"Bunlar herhangi bir din, tarikat veya alternatif tıp değildir. Yukarıda da açıklandığı üzere Müslüman bireyin ruhsal şifası, enerji kaynağı bellidir, bu tür safsatalarla ilgilenmesine ihtiyacı yoktur."}]}],"ht":[{"s":0,"x":"Okültizm: \"gizli saklı olanın bilgisi\"."},{"s":1,"x":"Fala inanıp hayatını ona göre şekillendiren, hadislere göre Hz. Peygamber'i inkâr etmiş sayılır, namazı kabul edilmez."},{"s":2,"x":"Kâhin gaybı ve geleceği bildiğini iddia eder; Kur'an'a göre bilgileri çoğu kere aldatıcıdır."},{"s":3,"x":"Medyum (\"aracı\"): ölülerle diriler arasında aracılık iddiası; geçmişten haber verir. Günümüzde kâhinlerin yerini medyumlar almıştır. İnsan ruhu çağrılamaz."},{"s":4,"x":"Astroloji bir fal türüdür (yıldız falı); burç takip etmek de bir çeşit faldır ve yasaklanmıştır."},{"s":5,"x":"Sihir, büyüden geneldir (büyü bir sihir türüdür). Kelamcıların çoğuna göre sihrin gerçekliği ve etkisi vardır; bazılarına göre göz boyama ve hiledir. Her hâlükârda yasaktır."},{"s":6,"x":"Yoga: Sanskrit \"yuj\"dan (kontrol etmek, birleştirmek); beden kontrolü ve meditasyonla kurtuluş yolu. Doğum yeri Hindistan, babası Patanjali; Hinduizm'in altı büyük öğretisinden biri. Uygulayan: yogi / yogini."},{"s":6,"x":"Müslüman, başka dinin propagandasına alet olmadan namaz, oruç, zekât, hac, dua ve istiğfarla kendini eğitip arındırabilir."},{"s":7,"x":"Reiki: Rei \"her yerde var olan\" + Ki \"ruhsal yaşam enerjisi\"; enerji aktarımıyla şifa iddiası. Kaynağı Tibet sanılır; 19. yy'da Japon Budist Dr. Mikao Usui ortaya çıkardı."},{"s":7,"x":"Aura: etrafta olduğuna inanılan enerji alanı; çakra: bedendeki 7 enerji merkezi. Bunlar din, tarikat ya da alternatif tıp değil; Müslüman'ın şifa ve enerji kaynağı bellidir."}]},{"t":"Küreselleşme, Doğal Afetler ve Terör","intro":"Küreselleşen dünyada İslâm'ın katkıları; afetleri günaha bağlamak, musibetlerin nedenleri, kelamcıların görüşleri ve Diyanet hizmetleri; terör, İslâm'ın davet metodu ve neoselefilik.","s":[{"h":"Küreselleşen dünyada din","b":[{"k":"d","t":"Küreselleşme","x":"Maddi ve manevi değerlerin millî sınırları aşarak dünya çapında yayılmasıyla ülkeler ve milletler arasında ekonomik, siyasal, sosyal ve kültürel etki ve ilişkilerin giderek artmasıdır."},{"k":"h","x":"Küreselleşen dünyada İslâm dininin insanlığa sunacağı bazı katkılar"},{"k":"n","n":1,"x":"İslâm son hak din olması hasebiyle evrenseldir."},{"k":"n","n":2,"x":"Allah sadece müminlere değil, tüm kullara rızık verir."},{"k":"n","n":3,"x":"Kâinattaki bütün varlıklar emanettir, korunmalıdır."},{"k":"n","n":4,"x":"Bütün işlerde Allah adaleti emretmektedir."},{"k":"n","n":5,"x":"Mahlûkata şefkatle muamele asıldır."},{"k":"not","x":"Kâinatın mutlak yaratıcısı olan Allah (c.c.), evreni kendisine emanet ettiği insanlardan kâinatı korumasını, onun tabii ve ekolojik dengesini bozmamasını istemektedir."}]},{"h":"Doğal afetler ve din","b":[{"k":"h","x":"Afetleri günaha bağlamak doğru mudur?"},{"k":"p","x":"İslâm bilginleri kötülüğü temelde ikiye ayırmışlardır: 1. Doğal olan, 2. İradeye bağlı olan."},{"k":"p","x":"Deprem doğal bir afettir. Bu ve benzeri afet insanı aşan ve sorumluluk gerektirmeyen olaydır. İnsanın burada sorumlu tutulacağı nokta **tedbirdir**."},{"k":"p","x":"İnsan bütün tedbirlerini almasına rağmen yine de musibet olursa bu durumda insan sorumluluktan kurtulmuş olur. Ancak bu durumda **imtihan** devreye girmektedir. İnsan bu olaylar ile sınanmaktadır."},{"k":"not","x":"Bu sınanma sadece musibete maruz kalanlar için değil çevredekiler için de geçerlidir."}]},{"h":"Musibetlerin nedenleri","b":[{"k":"n","n":1,"x":"İnsanların kendi yaptığı günahların karşılığı olarak birtakım bela ve musibetlere maruz kalmaktır. Bu görüşün dayanağı, Kur'an'da günah işleyen kavimlerin bazı felaketlerle helak edilmesidir."},{"k":"dikkat","x":"Ancak meydana gelen her musibeti de Allah'ın bir cezası olarak değerlendirmek Kur'an'ın insanlığa vermek istediği mesajla tam olarak bağdaştırılamaz."},{"k":"n","n":2,"x":"Allah'ın fiilleriyle irtibatlı meydana gelen çeşitli doğal felaketlerdir. Bunların amacı insanları imtihan etmeye, deneme ve sınamaya yöneliktir. Hastalıklar ve doğal afetler gibi birçok çeşitli felaketlere maruz kalan insanlar bu musibetler aracılığıyla kendi acizliğinin ve güçsüzlüğünün farkına varır."}]},{"h":"Kelamcıların görüşleri","b":[{"k":"p","x":"**Mutezile kelamcıları:** Allah'ın yaratıklara, ister sorumlu varlıklar olsun isterse sorumlulukları olmasın, çeşitli musibetlerle acı ve ızdırap çektirmesini ibret ve imtihan vesilesi olarak görmüşlerdir. Bu acıların karşılığında ahirette sevap ve mükâfat almaları gerektiğini (vacib) söylemişlerdir."},{"k":"p","x":"**Ehl-i Sünnet kelamcıları:** Dünyada yaşanan acı ve ızdırapların birtakım ilahi hikmetlere binaen olduğunu söylerler. Bu hikmetleri, acı ve ızdıraplara sabredilmesi karşılığında Allah'ın günahlarını affetmesi, manevi derecelerini yükseltmesi ve nefislerini kötü duygu ve düşünceden temizlemek suretiyle ahlaklarını olgunlaştırması olarak vermişlerdir."},{"k":"dikkat","x":"Ancak Mutezile'den farklı olarak, bunları yapmak Allah (c.c.) için vacip olmayıp, caizdir."},{"k":"tbl","r":[["","Mutezile","Ehl-i Sünnet"],["**Acı ve ızdırap**","İbret ve imtihan vesilesi","İlahi hikmetlere binaen"],["**Karşılığı**","Ahirette sevap ve mükâfat","Günahların affı, derecelerin yükselmesi, ahlakın olgunlaşması"],["**Allah için**","Vacip","Caiz (vacip değil)"]]}]},{"h":"Musibetler ya da doğal afetler karşısında Diyanet hizmetleri","b":[{"k":"n","n":1,"x":"İslâm dininin asli kaynağı olan Kur'an'ın musibetlere yaklaşımını halkın anlayabileceği tarzda anlatmak."},{"k":"n","n":2,"x":"Din hizmetleri sunduğu insanları bireysel çevrelerine, bütün insanlara ve Allah'a karşı sorumluluklarını yerine getirmeleri konusunda uyarmak."},{"k":"n","n":3,"x":"Kur'an'da Allah'ın müminlere yardım edeceği ifadelerinin gerçekleşmesi için insanların üzerlerine düşeni yapmaları gerektiğini anlatmak."},{"k":"n","n":4,"x":"Doğal afetleri de içerecek biçimde her konuda tedbirli olmanın dinin emri olduğunu bildirmek."},{"k":"n","n":5,"x":"Afetlerden zarar gören, acı ve ızdıraplara maruz kalan bireylerin ruhsal sağlıklarını korumaları amacıyla bu acılara karşı günahlardan sıyrılıp Allah katında mükâfatlara nail olacakları telkinlerinde bulunmak."}]},{"h":"Terör ve İslâm'ın teröre bakışı","b":[{"k":"d","t":"Terör","x":"Sürekli ve sistemli şiddet hareketleri, cinayet, adam kaçırma, benzeri faaliyetlerle korku uyandırma, yıldırma."},{"k":"h","x":"İslâm'ın teröre bakışı"},{"k":"dikkat","x":"Terör ve terörist hareketleri İslâm'la bağdaştırmak İslâm gibi hür iradeye dayanan, sosyal barışı amaç edinen bir dine büyük bir iftiradan başka bir şey değildir."},{"k":"p","x":"İslâm kelimesinin anlamından da anlaşılacağı üzere dinin asıl doğasında cebir ve şiddete yer yoktur. Dini yaymak için teröre bulaşmak ancak İslâm'ın evrensel mesajını çarpıtmaktır."},{"k":"h","x":"İslâm'ın davet metodu"},{"k":"p","x":"İslâm'ın, diğer bir deyişle Kur'an'ın tebliğ ve davet metodu; **yumuşaklık, iyi öğüt ve güzel sözdür**. Yüce Allah Kur'an-ı Kerim'in çeşitli surelerinde peygamberlerinden insanlara yumuşaklıkla, güzel öğütle yaklaşmalarını istemektedir ve bu metotla ilgili birçok ayet ve hadis bulunmaktadır."}]},{"h":"Neoselefilik","b":[{"k":"p","x":"İngilizce “yeni, acemi, taze, modern ve keşfedilmemiş” gibi anlamlara gelen “neo” ön eki ile Arapça “Selefiyye” kelimelerinin birleşiminden oluşan Neo Selefilik kavramı, Türkçeye “Modern Selefilik” veya “Çağdaş Selefilik” olarak çevrilebilir."},{"k":"d","t":"Neoselefilik","x":"Her ne kadar son zamanlarda kendilerini selefe nispet etseler de daha çok Vahhabiliğin haricîliğe evrilmiş şekliyle özdeşleşen, sadece Kur'an'ı ve sünneti kabul eden, mezhepleri reddeden, fanatik, aşırıcı, dışlamacı, ötekileştirici, tekfir edici, kendilerinden olmayan Müslümanlara karşı düşmanca tavır takınan ve şiddeti tecviz edici akım."}]}],"ht":[{"s":0,"x":"Küreselleşme: maddi ve manevi değerlerin millî sınırları aşıp yayılmasıyla ülkeler arası etkileşimin artması."},{"s":0,"x":"İslâm'ın 5 katkısı: son hak din olarak evrensellik · Allah tüm kullara rızık verir · varlıklar emanettir · her işte adalet · mahlûkata şefkat."},{"s":1,"x":"Afetlerde insanın sorumluluğu tedbirdir; tedbire rağmen musibet olursa sorumluluk kalkar, imtihan devreye girer. İmtihan hem musibete uğrayanlar hem çevredekiler içindir."},{"s":2,"x":"Musibetlerin 2 nedeni: günahların karşılığı (dayanağı helak edilen kavimler; ama her musibeti ceza saymak Kur'an'ın mesajıyla bağdaşmaz) ve Allah'ın fiilleriyle irtibatlı imtihan (insan acizliğini fark eder)."},{"s":3,"x":"Mutezile: musibetler ibret ve imtihandır; ahirette karşılığını vermek Allah'a vaciptir. Ehl-i Sünnet: ilahi hikmetlere binaendir (günahların affı, derecelerin yükselmesi, ahlakın olgunlaşması); bunlar Allah için vacip değil, caizdir."},{"s":4,"x":"Diyanet hizmetleri (5): Kur'an'ın musibet yaklaşımını anlatmak · sorumlulukları hatırlatmak · Allah'ın yardımı için üzerine düşeni yapmayı anlatmak · tedbirin dinin emri olduğunu bildirmek · zarar görenlere günahlardan arınma ve mükâfat telkini."},{"s":5,"x":"Terör: sürekli ve sistemli şiddetle korku uyandırma, yıldırma. Terörü İslâm'la bağdaştırmak hür iradeye dayanan, sosyal barışı amaçlayan bir dine iftiradır."},{"s":5,"x":"İslâm'ın davet metodu: yumuşaklık, iyi öğüt ve güzel söz."},{"s":6,"x":"Neoselefilik: \"neo\" + \"Selefiyye\" → Modern / Çağdaş Selefilik. Vahhabiliğin haricîliğe evrilmiş şekli; mezhepleri reddeden, tekfirci ve şiddeti tecviz eden akım."}]},{"t":"Din–Bilim İlişkisi, Yapay Zekâ ve Transhümanizm","intro":"Din ile bilim çatışır mı, İslâm akıl dini mi, din sınırlıyor mu; yapay zekâ ve insan zekâsı, yapay zekâ ve din; transhümanizmin tanımı, amacı ve değerlendirmesi.","s":[{"h":"Din ile bilim çatışır mı?","b":[{"k":"p","x":"Din ve bilim birbirine karşı değildir. Din ile bilim arasında çatışma olmadığı, çatışmanın bilimden din üretmeye kalkışanlar ile dini bilim gibi görenler arasında olduğu ortaya çıkmıştır."},{"k":"p","x":"Hâlbuki her ikisinin de hedefinde hakikat vardır, fakat bu hakikate farklı yöntemlerle ulaşırlar. Ayrıca günümüz modern dünyasında birçok alanda ispatlanmış, din ve bilimin uyuştuğu birçok husus vardır."}]},{"h":"İslâm akıl dini mi?","b":[{"k":"p","x":"Yüce Allah kurduğu sistemi ve yarattığı insanı çok iyi bildiği için peygamberlik görevini sisteme zarar vermeyecek ve insan aklını kısıtlamayacak şekilde belirlemiştir. İnsan dışarıdan bilgi almaya muhtaç olduğu için peygamber insanın bilmediği alanda birtakım bilgiler verir ve bu bilgileri nasıl kullanacağına dair fikir verir. İnsan bunun karşısında aklına müracaat eder ve kendine göre bir fayda-zarar envanteri çıkarır."},{"k":"dikkat","x":"Eğer bu envanterleri, peygambersiz, sadece zihinde olan bilgi ile yaparsa kendisini dar ve kısır bir alana hapsetmiş olur. Öyleyse insanın sadece akılla bir yere ulaşması ve bir sonuç elde etmesi mümkün değildir."},{"k":"p","x":"İslâm akla hitap eder ve aklın kavramasını önceler. İslâm'da aklın inkâr edilemez derecede önemi vardır."},{"k":"not","x":"“İslâm akıl dini” derken aklın ürettiği anlamında değil, aklın kavrayabileceği bir din demektir. Aklı tek yönlü bakışa ve sınırlı bir bilgiye mahkûm eden, aklı devre dışı bırakır."}]},{"h":"Din sınırlıyor mu?","b":[{"k":"p","x":"İnsanın hayatında sınırlayan olması gayet tabii ve gereklidir. Sınırsız bir hayatta olacaklar karmaşa ve çatışmadır. Çünkü sınırlar kurallardır, kuralsız bir hayat ve toplum olamaz."},{"k":"ornek","x":"Örneğin trafik kurallarının olmadığını düşünelim, neler olur? Kuralsız hayat kısa, kuralsız toplum kaostur."},{"k":"p","x":"Fakat sınırlar makûl ve hareket alanını yok etmeyecek şekilde olmalı. Din de tam olarak bunu yapıyor: İnsanın ve tabiatın doğallığını koruyan birtakım kurallar getiriyor."}]},{"h":"Yapay zekâ","b":[{"k":"d","t":"Yapay zekâ","x":"İnsan zekâsının karakteristik özelliklerini bilgisayara kazandıran algoritmalar geliştiren bir bilim dalıdır."},{"k":"h","x":"Yapay zekânın insan zekâsıyla karşılaştırılması"},{"k":"tbl","r":[["","İnsan zekâsı","Yapay zekâ"],["**Bilginin sürekliliği**","Bozulabilir (ölümcül)","Sürekli (ölümsüz)"],["**Bilginin transferi**","Zordur","Çok kolaydır"],["**Maliyet**","Pahalı","Ucuz"],["**Bilginin tutarlılığı**","Kararsız ve değişken","Kararlı ve tutarlı"],["**Yeniden kullanılabilirlik**","Dokümante edilmesi zor","Dokümante edilebilir"],["**Karar verme hızı**","Daha yavaş","Daha hızlı"],["**Yaratıcılık**","Bilinmeyeni ortaya çıkaran","İlham alamaz"],["**Kullanılan bilgi kaynağı**","Duyu organları","Sensörler"],["**Odaklanma**","Geniş içerik","Dar içerik"]]},{"k":"h","x":"Yapay zekâ ve din"},{"k":"p","x":"Yapay zekâ din biliminin değişik alanlarında da hizmet verecek sistemlerin geliştirilmesine imkân verecektir. Mesela dinî rehberlik, fetvalar, ayetleri tefsir etmek ve hadisleri anlamak gibi alanlarda kullanılacaktır."},{"k":"p","x":"Yapay zekâ sistemleri çok iyi tasarlanmış çıkarım mekanizmalarını kullanarak sahip oldukları dinî bilgileri kolaylıkla işleyebilirler, o bilgileri kullanarak muhakeme ve yorumlar yapabilirler."},{"k":"dikkat","x":"Ancak insanlarda olduğu gibi yapay zekânın da yorumlamalarında Kur'an ve sünnet çizgisinden çıkmaması esastır."}]},{"h":"Transhümanizm","b":[{"k":"d","t":"Transhümanizm","x":"Modern bilim ve teknolojik araçlar vasıtasıyla insanların evrimin getirdiği mevcut biyolojik durumlarından daha üstün olmalarına yardımcı olan, onların biyolojik, psikolojik ve bilişsel yeteneklerinin geliştirilmesi ve yetkinleştirilmesi amacını güden fikir ve uygulamalara inanan ve bunları hayata geçirmeye çalışan bir insan hareketi."},{"k":"h","x":"Amacı"},{"k":"p","x":"Transhümanist akımın öne çıkan temsilcilerinden olan **Bostrom** ve **David Pearce**, Dünya Transhümanist Derneği'ni kurarken, derneğin amacının şunlar olduğunu açıklarlar:"},{"k":"li","x":"İnsanoğlunun durumunu iyileştirmek,"},{"k":"li","x":"Bilim ve teknoloji ile insanın tüm fiziksel ve zihinsel hastalıklarını ortadan kaldırmak,"},{"k":"li","x":"İstem dışı acı çekmeyi sona erdirmek,"},{"k":"li","x":"Yaşlanmayı gidermek,"},{"k":"li","x":"Yaşam kalitesini arttırarak beden sağlığının en iyi duruma getirilmesini sağlamak,"},{"k":"li","x":"İnsanın ölümsüz bir varlığa dönüştürülmesi veya ölümün zorunlu olmaktan çok isteğe bağlı bir hâle getirilmesini sağlamak."},{"k":"p","x":"Temel dayanakları teknolojidir. Önerilen teknoloji kümelerini, genel olarak nanoteknoloji, biyoteknoloji, bilgi teknolojisi ve bilişsel bilim anlamına gelen **NBIC** gibi harf kombinasyonlarıyla kabul ederler."},{"k":"tbl","r":[["Harf","Teknoloji"],["**N**","Nanoteknoloji"],["**B**","Biyoteknoloji"],["**I**","Bilgi teknolojisi"],["**C**","Bilişsel bilim"]]},{"k":"h","x":"Değerlendirme"},{"k":"p","x":"Transhümanizm her ne kadar bir din olduğu iddiasında olsa da bunun bir karşılığı olmadığını görmekteyiz."},{"k":"dikkat","x":"Transhümanizmin kendine biçtiği rolde aslında tanrılık vardır. Çünkü yeni bir yaratmadan bahsetmektedir ve insana ölümsüzlük vaat etmektedir. Bu vesile ile Allah'ın yarattığı düzene müdahale etmek istemektedir."},{"k":"p","x":"Temel felsefesi ve hedeflerini göz önüne alarak düşündüğümüzde İslâm'ın temel prensiplerine aykırılıklar görmekteyiz. Sonuç olarak bu projede insanlığa faydalı bazı şeyler var gibi görünüyor olsa da insanlık için çok tehlikeli ve İslâm'ın temel ilkelerine de aykırıdır."}]}],"ht":[{"s":0,"x":"Din ile bilim çatışmaz; çatışma, bilimden din üretmeye kalkışanlarla dini bilim gibi görenler arasındadır. İkisi de hakikati hedefler, farklı yöntemlerle ulaşır."},{"s":1,"x":"İnsan dışarıdan bilgiye muhtaçtır; peygamber bilmediği alanda bilgi verir, insan aklıyla fayda-zarar envanteri çıkarır. Peygambersiz, yalnız akılla bir sonuca ulaşılamaz."},{"s":1,"x":"\"İslâm akıl dini\": aklın ürettiği değil, aklın kavrayabileceği din demektir."},{"s":2,"x":"Sınırlar kurallardır; kuralsız hayat kısa, kuralsız toplum kaostur (trafik örneği). Din, makûl ve insanın ve tabiatın doğallığını koruyan kurallar getirir."},{"s":3,"x":"Yapay zekâ: insan zekâsının özelliklerini bilgisayara kazandıran algoritmalar geliştiren bilim dalı."},{"s":3,"x":"İnsan zekâsı: bozulabilir, transferi zor, pahalı, kararsız, yavaş ama yaratıcı; duyu organlarıyla, geniş içerikli. Yapay zekâ: sürekli, kolay transfer, ucuz, tutarlı, hızlı ama ilham alamaz; sensörlerle, dar içerikli."},{"s":3,"x":"Yapay zekâ dinî rehberlik, fetva, tefsir ve hadiste kullanılacak; yorumlarında Kur'an ve sünnet çizgisinden çıkmaması esastır."},{"s":4,"x":"Transhümanizm: bilim ve teknolojiyle insanı mevcut biyolojik durumundan üstün kılmayı, yeteneklerini yetkinleştirmeyi amaçlayan hareket."},{"s":4,"x":"Dünya Transhümanist Derneği: Bostrom ve David Pearce. Amaç: hastalıkları kaldırmak, yaşlanmayı gidermek, ölümsüzlük ya da isteğe bağlı ölüm. Dayanak NBIC: nano, bio, bilgi, bilişsel."},{"s":4,"x":"Transhümanizmde tanrılık iddiası vardır (yeni yaratma, ölümsüzlük vaadi, Allah'ın düzenine müdahale); İslâm'ın temel ilkelerine aykırı ve insanlık için tehlikelidir."}]}];
const SORULAR = [{"u":0,"q":"Ateizm kelimesi hangi kelimenin başına olumsuzluk eki \"a\" getirilerek oluşturulmuştur?","a":["theos","deus","gnostos","nihil"],"x":"Ateizm, Yunancada \"Tanrı\" anlamına gelen \"theos\" kelimesinin başına olumsuzluk eki \"a\" getirilerek oluşturulmuştur. \"Deus\" deizmin, \"gnostos\" agnostisizmin, \"nihil\" nihilizmin köküdür."},{"u":0,"q":"Ateizm hangi tutuma karşı tepkisel bir hareket olarak ortaya çıkmıştır?","a":["Kilisenin bilime ve bilim adamına yönelik baskıcı tutumuna","Pozitivizmin metafiziği reddetmesine","Satanist grupların Hristiyanlığa tepkisine","Reform hareketinin mezhepçiliğine"],"x":"Ateizm, Hristiyanlığın ve özellikle kilisenin bilime ve bilim adamına yönelik baskıcı tutumuna karşı tepkisel bir hareket olarak ortaya çıkmıştır; kökeni antik çağa dayanır."},{"u":0,"q":"\"Ateizm denilince akla gelen tür\" olarak nitelenen ve Tanrı'nın varlığının düşünerek, tartışarak, deliller üreterek inkâr edildiği ateizm çeşidi hangisidir?","a":["Teorik ateizm","Mutlak ateizm","Pratik / fiilî ateizm","İlgisizlerin ateizmi"],"x":"Teorik ateizm, Tanrı'nın varlığının bilinçli bir şekilde reddedilmesidir; ateizm denilince akla gelen türü budur."},{"u":0,"q":"\"Mutlu ve sağlıklı günlerinde Tanrı'yı inkâr eden bir ateistin dara düştüğünde Tanrı'ya sığınması\" hangi ateizm çeşidine karşı delil olarak gösterilir?","a":["Mutlak ateizm","Teorik ateizm","Pratik ateizm","İlgisizlerin ateizmi"],"x":"Mutlak ateizm insanda doğuştan Tanrı fikrinin olmadığını savunur. Halbuki her insanın derinliklerinde Tanrı fikri saklıdır; dara düşen ateistin Tanrı'ya sığınması bunun delilidir."},{"u":0,"q":"Materyalizme göre aşağıdakilerden hangisi doğrudur?","a":["Madde ezelî ve ebedîdir, var olan her şey maddeden ibarettir.","Madde yaratılmıştır ama âleme Tanrı karışmaz.","Tanrı'nın varlığı da yokluğu da bilinemez.","Bilginin kaynağı akıl, his ve haber-i sadıktır."],"x":"Materyalizm maddeyi ezelî ve ebedî kabul eder, her şeyin maddeden ibaret olduğunu ileri sürer
