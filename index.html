sche","Bazarov – Friedrich Jacobi","Üstün insan – Ivan Turgenev"],"x":"Rus yazar Ivan Turgenev, romanında (1862) nihilist karakter Bazarov'u kullanmasıyla kavramı popüler hâle getirmiştir."},{"u":1,"q":"Pek çok dinî ve ahlaki değeri yok sayıp yerine \"üstün insan\"ı getiren düşünür kimdir?","a":["Nietzsche","Friedrich Jacobi","Ivan Turgenev","Huxley"],"x":"Nihilizmi anlaşılır ve belirli bir mantık çerçevesine oturtulabilir hâle getirmeye çalışan Nietzsche, dinî ve ahlaki değerleri yok sayıp yerine \"üstün insan\"ı getirmiştir."},{"u":2,"q":"Evrimcilik hangi yönüyle materyalizmle aynı kabul edilmiştir?","a":["İlk varlığın tesadüfen ortaya çıktığını kabul etmesi","Tanrı'nın âleme karışmadığını söylemesi","Bilginin kaynağını deneyle sınırlaması","Türler arası geçişi reddetmesi"],"x":"Evrimcilikteki ortak ata tesadüfen var olmuştur; materyalizme göre de ezelî ve ebedî ilk varlık tesadüfen ortaya çıkmıştır. Bu yönüyle iki akım aynıdır."},{"u":2,"q":"\"Canlıların dış yapı farklılıklarından ötürü hayatta kalma şansının ve üreme başarısının değişkenlik göstermesi\" neyin tanımıdır?","a":["Doğal seçilim","Ortak ata","Tekâmül","Kademeli değişim"],"x":"Bu ifade doğal seçilimin tanımıdır."},{"u":2,"q":"Evrim teorisini 19. yüzyılın ortalarında geliştirip sistemleştiren kimdir?","a":["Darwin","Leibniz","Huxley","August Comte"],"x":"Evrimcilik Darwin tarafından 19. yy.'ın ortalarında geliştirilip sistemleştirilmiştir."},{"u":2,"q":"İslâm düşünürlerinin \"tekâmül\" kavramı için aşağıdakilerden hangisi doğrudur?","a":["Canlının kendi iç bünyesinde kemale ilerlemesidir; türler arası geçiş söz konusu değildir.","Türlerin doğal seçilimle birbirine dönüşmesidir.","Ortak atadan milyonlarca yılda kademeli değişimdir.","Maddenin tesadüfen canlılığa geçmesidir."],"x":"Tekâmül, bir canlının kendi iç bünyesinde kemale doğru ilerlemesidir; her varlığın kendine özgü yaratılış biçimi vardır ve türler arası geçiş asla söz konusu değildir."},{"u":2,"q":"Aşağıdakilerden hangisi tekâmüle örnek olarak verilmiştir?","a":["İncir çekirdeğinin incir ağacına dönüşmesi","Bir türün başka bir türe dönüşmesi","İnsanın çeşitli aşamalardan geçerek insana dönüşmesi","Ortak atanın farklı türlere ayrılması"],"x":"Bir incir çekirdeğinin incir ağacına dönüşmesi ve bir kromozomun belli şartlarda insana dönüşmesi tekâmüldür, asla evrim değildir."},{"u":2,"q":"Evrim iddiasına karşı \"somut misal\" itirazı neyi ifade eder?","a":["Bir canlının diğerinin evrimiyle meydana geldiğine dair hiçbir araştırmada örneğe rastlanmamış olmasını","Fosillerin tarihlendirilemediğini","Doğal seçilimin hiç gözlenmediğini","Büyük patlamanın sebebinin bilinmediğini"],"x":"Bir canlının diğer canlının evrimi sonucu meydana geldiğini iddia edebilmek için somut bir misal gerekir; yapılan hiçbir araştırmada böyle bir örneğe rastlanmamıştır."},{"u":2,"q":"Deizmin Türkçe karşılıkları hangileridir?","a":["İlahiyye / ilahçılık","Lâ edriyye / bilinemezcilik","Tenâsüh / ruh göçü","Sûfestâiyye / kuşkuculuk"],"x":"Deizm (ilahiyye/ilahçılık) Latince \"deus\"tan türetilmiş, ateizme karşı tanrıcılık anlamında kullanılmıştır."},{"u":2,"q":"Deizme göre aşağıdakilerden hangisi doğrudur?","a":["Allah âlemi yaratıp düzenlemiş, harekete geçirmiş, fakat artık âleme karışmamaktadır.","Tanrı'nın varlığı da yokluğu da bilinemez.","Tanrı fikri insanda doğuştan yoktur.","Tanrı'ya ancak vahiy ve peygamber aracılığıyla inanılır."],"x":"Deizm, Allah'ın âlemin mimarı olduğunu, onu düzenleyip harekete geçirdiğini, fakat artık âleme karışmadığını tasavvur eder; Tanrı'ya din, peygamber veya vahiy aracı olmaksızın inanılır."},{"u":2,"q":"Deiste göre Tanrı'nın varlığına hangi yollarla inanılır?","a":["Akıl, gözlem ve sezgi","Vahiy ve peygamber","Deney ve tecrübe","Keşif ve ilham"],"x":"Deizm din, peygamber veya vahiy aracı olmaksızın bireyin akıl, gözlem, sezgi gibi yollarla Tanrı'nın varlığına inanmasına dayanır."},{"u":3,"q":"Kötülük problemi hangi akımın temel argümanlarından biridir?","a":["Ateizm","Deizm","Pozitivizm","Septisizm"],"x":"Kötülük problemi ateizmin temel argümanlarından biridir: kötülük varsa merhametli ve her şeye gücü yeten Tanrı yoktur."},{"u":3,"q":"Depremler, kuraklıklar ve hastalık yapan bakteriler hangi kötülük türüne girer?","a":["Doğal / fiziksel kötülük","Ahlaki kötülük","Metafiziksel kötülük","İradî kötülük"],"x":"İnsan eylemlerinden bağımsız olarak meydana gelen deprem, fırtına, kuraklık, bakteri gibi kötülükler doğal/fiziksel kötülüktür."},{"u":3,"q":"Leibniz'in eklediği metafiziksel kötülük neyi ifade eder?","a":["Yaratılmış evrenin sonluluğu ve sınırlılığı","İnsan kaynaklı zulüm ve haksızlıklar","İnsandan bağımsız doğal felaketler","Kulun kesbiyle kazanılan kötülük"],"x":"Leibniz doğal ve ahlaki kötülüğe \"yaratılmış evrenin sonluluğu ve sınırlılığı\" olan metafiziksel kötülüğü eklemiştir."},{"u":3,"q":"Ehl-i Sünnet kelamcıları doğal kötülüğe hangi çerçeveden bakarlar?","a":["Hikmet ve imtihan","Salah","Kesb","Tesadüf ve zorunluluk"],"x":"Ehl-i Sünnet'e göre Allah kötülüksüz bir dünya yaratabilirdi (Cennet gibi); ama hikmeti gereği dünyayı imtihan alanı kılmıştır."},{"u":3,"q":"Mutezile doğal kötülüğü hangi kavramla açıklar?","a":["Salah","Kesb","Tekâmül","Fetret"],"x":"Mutezile doğal kötülüğü \"salah\" kavramıyla açıklar: bize kötü görünen şeyler, farkında olmasak da aslında iyidir."},{"u":3,"q":"\"Halk-ı şer şer değil, kesb-i şer şerdir\" ilkesi hangi ekole aittir?","a":["Eş'arîler","Mutezile","Mâtürîdîler","Selefiyye"],"x":"Eş'arîlere göre bütün fiillerin yaratıcısı Allah'tır; kötü fiiller Allah'ın yaratması yönüyle değil, kulun kesbi nedeniyle kötülük vasfını kazanır."},{"u":3,"q":"Ahlaki kötülükte insanı kendi fiillerinin yaratıcısı (doğrudan faili) kabul eden ekol hangisidir?","a":["Mutezile","Eş'arîler","Mâtürîdîler","Ehl-i Sünnet"],"x":"Mutezile'ye göre insan temyiz melekesine sahiptir ve kendi fiillerinin yaratıcısıdır; ahlaki kötülüklerin kaynağı özgürce eyleme yönelen insanın kendisidir."},{"u":3,"q":"Mâtürîdîler Allah'ın fiilleri irade etmesini nasıl anlarlar?","a":["Sadece onları yaratmayı irade etmesi olarak","Onlara rıza göstermesi olarak","Onları emretmesi olarak","Onlara kulun kesbini eklemesi olarak"],"x":"Mâtürîdîlere göre de bütün fiillerin yaratıcısı Allah'tır; ancak Allah'ın fiilleri irade etmesi, sadece onları yaratmayı irade etmesidir."},{"u":3,"q":"Eş'arî ve Mâtürîdî anlayışında fiilin oluşum sırası nasıldır?","a":["Önce insan fiile yönelir, sonra Allah o fiili irade eder ve yaratır.","Önce Allah fiili yaratır, sonra insan ona yönelir.","İnsan fiili yaratır, Allah ona izin verir.","Allah fiili irade eder, insan onu kendi gücüyle yaratır."],"x":"Her iki ekolde de önce insan fiile yönelir, sonra Allah onun yöneldiği bu fiili irade eder ve yaratır."},{"u":4,"q":"İnsanları intihara sürükleyen sebeplerin başında hangisi gelmektedir?","a":["Depresyon / bunalım","Başarısızlık","Ekonomik sıkıntı","Kader inancı"],"x":"İntihara sürükleyen sebeplerin başında depresyon/bunalım gelir; sosyal tecritten boşanma travmalarına kadar pek çok vaka bunalıma götüren süreçte yer alır."},{"u":4,"q":"Aşağıdakilerden hangisi \"intiharı önlemede dinin rolü\" başlığında sayılmamıştır?","a":["İntihar edenin eceliyle ölmediğinin bildirilmesi","Hayatın kutsal ve intiharın büyük günah olması","Sıkıntıların günahlara kefaret ve ahirette karşılıklı olması","Kader inancının yaşama sevinci ve huzur vermesi"],"x":"Dinin rolü dört maddede sayılır: hayatın kutsallığı, imtihan inancıyla Allah'a güven, sıkıntıların kefaret ve karşılığı, kader inancı. Eceliyle ölmediğini söylemek Mutezile'nin görüşüdür."},{"u":4,"q":"Ehl-i sünnete göre intihar eden kişi eceliyle mi ölmüştür?","a":["Evet; ölen herkes kendi eceliyle ölür, ölüm şekli bunu değiştirmez.","Hayır; kendini öldürmeseydi ölmeyecekti.","Hayır; eceli intiharla öne alınmıştır.","Bu konuda görüş bildirmemişlerdir."],"x":"Ehl-i sünnet âlimlerine göre ölen herkes kendi eceliyle ölmüştür. Mutezile'ye göre ise intihar eden eceliyle ölmemiştir."},{"u":4,"q":"\"Kendini öldürmeseydi ölmeyecekti\" diyerek intihar edenin eceliyle ölmediğini savunan ekol hangisidir?","a":["Mutezile","Eş'arîler","Mâtürîdîler","Ehl-i sünnet"],"x":"Mutezile'ye göre intihar eden eceliyle ölmemiştir; kendini öldürmeseydi ölmeyecekti."},{"u":4,"q":"Hastanın hayatta kalmasını sağlayan müdahalelerin yapılmaması ötanazinin hangi türüdür?","a":["Pasif ötanazi","Aktif ötanazi","Gönüllü ötanazi","Dolaylı ötanazi"],"x":"Aktif ötanazi hastaya ölümcül doz enjekte edilmesi, pasif ötanazi ise hayatta kalmasını sağlayan müdahalelerin yapılmamasıdır."},{"u":4,"q":"Ötanazi hastanın rızasıyla yapılırsa hükmü nedir?","a":["İntihar","Cinayet","Caiz","Mekruh"],"x":"Ötanazi her iki türüyle de caiz değildir: hastanın rızasıyla olursa intihar, aksi hâlde cinayet olur."},{"u":4,"q":"İntihar kaderde varsa intihar eden niçin günahkâr olur?","a":["Allah'ın yasakladığı bir biçimde kendi ölümüne yol açtığı, yani kendi tercihi için","Kaderindeki ölüm fiilini icra ettiği için","Ecelini değiştirdiği için","Kader inancını inkâr ettiği için"],"x":"İntihar eden, kaderindeki ölüm fiilini icra ettiği için değil, Allah'ın yasakladığı bir biçimde kendi ölümüne yol açtığı için sorumludur; kul kendi tercihi nedeniyle günahkârdır."},{"u":4,"q":"İntihar saldırıları değerlendirilirken esas alınan ilke hangisidir?","a":["Meşru bir hedefe ulaştıran yolların da meşru olması gerekir.","Hedef meşruysa her yol mubahtır.","Savaşta sivil-asker ayrımı yapılmaz.","Vatan savunmasında can feda etmek her şekilde övülür."],"x":"Mal, can, namus ve vatanı korumak meşrudur; ancak meşru hedefe ulaştıran yolların da meşru olması gerekir. Sivil-asker ayırmadan bomba patlatmak Müslüman şahsiyetine yakışmaz."},{"u":5,"q":"Fetret kavramı özellikle hangi zaman aralığı için kullanılır?","a":["Hz. İsa ile Hz. Muhammed arası","Hz. Musa ile Hz. İsa arası","Hz. Âdem ile Hz. Nuh arası","Hz. Muhammed'den kıyamete kadar"],"x":"Fetret özellikle Hz. İsa ile Hz. Muhammed arasında geçen zaman için kullanılır; ancak Hz. Muhammed'den sonra bu durumda olanları da kapsar."},{"u":5,"q":"\"Ehl-i fetret ahirette imtihana tâbi tutulur, neticesine göre gidecekleri yer belli olur\" görüşü kime aittir?","a":["İbn Teymiyye","Eş'arî","Mâtürîdî","İmam Rabbânî"],"x":"Bu görüş İbn Teymiyye'ye aittir."},{"u":5,"q":"Ehl-i fetretin ehl-i necât (cennetlik) olduğunu söyleyen kimdir?","a":["Eş'arî","Mâtürîdî","İbn Teymiyye","İmam Rabbânî"],"x":"Eş'arî'ye göre fetret ehli ehl-i necâttır, yani cennetliktir."},{"u":5,"q":"\"Akıllarını kullanıp tek olan yaratıcıyı bulurlarsa cennetlik, aksi hâlde cehennemliktir\" görüşü kime aittir?","a":["Mâtürîdî","Eş'arî","Gazzâlî","İbn Teymiyye"],"x":"Mâtürîdî'ye göre fetret ehli aklını kullanıp tek yaratıcıyı bulursa cennetlik, bulmazsa cehennemliktir."},{"u":5,"q":"İmam Rabbânî'ye göre ehl-i fetretin âkıbeti nedir?","a":["Ne cennete ne cehenneme giderler; kul hakları ödendikten sonra toprak olurlar.","Ahirette imtihan edilirler.","Kesin olarak cennetliktirler.","Akıllarıyla Allah'ı bulamazlarsa cehennemliktirler."],"x":"İmam Rabbânî'ye göre ehl-i fetret ne cennete ne cehenneme gider; kul hakları ödendikten sonra toprak olurlar."},{"u":5,"q":"Gazzâlî'nin sınıflandırmasında kesin olarak azaba uğratılacak olanlar kimlerdir?","a":["Peygamber'in davetini, mucizelerini ve güzel ahlâkını duyduğu hâlde iman etmeyenler","Peygamber'in davetini hiç duymayanlar","Yalnızca ismini ve aleyhindeki menfî propagandayı duyanlar","Fetret döneminde yaşayanlar"],"x":"Gazzâlî'ye göre davetini, mucizelerini ve güzel ahlâkını duyup iman etmeyen sınıf kesin olarak azaba uğratılacaktır."},{"u":5,"q":"Gazzâlî, Peygamber'in yalnızca ismini ve aleyhindeki menfî propagandayı duyanlar hakkında ne der?","a":["Ehl-i necat olacaklarını umarım.","Kesin olarak cennetliktirler.","Kesin olarak azaba uğratılacaklardır.","Ahirette imtihan edileceklerdir."],"x":"Gazzâlî üçüncü sınıf için \"Bunların da ehl-i necat olacaklarını, yani Cennete gireceklerini umarım\" der."},{"u":6,"q":"Ruh çağırma Osmanlı literatüründe hangi isimle anılmıştır?","a":["Huddâmcılık","İlmü'l-azâim","Tayy-i mekân","Tenâsüh"],"x":"İslâm dünyasında \"ilmü istihzâri'l-ervâh\" ve \"ilmü'l-azâim\" tabirleriyle dile getirilen ruh çağırma, Osmanlı literatüründe huddâmcılık olarak isimlendirilmiştir."},{"u":6,"q":"Ruh çağırma hakkında aşağıdakilerden hangisi doğrudur?","a":["Ölen insanların ruhlarıyla temas kurulduğuna veya çağrıldığına dair bir rivayet yoktur.","Peygamberlerin ölülerin ruhlarıyla temas kurduğu rivayet edilmiştir.","Kâhinlerin ölülerin ruhlarını çağırdığı Kur'an'da bildirilmiştir.","Ruh çağırma tasavvufta keramet sayılmıştır."],"x":"Peygamberlerin meleklerle, bazı kâhinlerin cinlerle teması olduğundan söz edilse de ölen insanların ruhlarıyla temas kurulduğuna veya çağrıldığına ilişkin bir rivayet yoktur."},{"u":6,"q":"Tayy-i zaman ve tayy-i mekân için aşağıdakilerden hangisi doğrudur?","a":["Allah'ın sevgili kullarına bahşettiği bir keramettir ve hem ruhen hem bedenen gerçekleşir.","Ruhun uykuda bedenden ayrılarak yolculuk etmesidir.","Teosofik/okültist bir inançtır.","Astral seyahatin tasavvuftaki adıdır."],"x":"Tayy-i zaman ve tayy-i mekân, Allah'ın sevgili kullarına bir anda uzun mesafeler kat ettirmesi kerametidir; hem ruhen hem bedenen gerçekleşir ve astral seyahatle ilgisi yoktur."},{"u":6,"q":"Tayy-i zaman ve tayy-i mekânın Kur'an'daki dinî mesnedi olarak hangi örnekler verilmiştir?","a":["Ashâb-ı Kehf ve Hz. Süleyman'ın yanındaki kişi","Hz. Musa ve Hızır","Hz. Yunus ve balık","Hz. İbrahim ve ateş"],"x":"Kur'an'da bu kavramlara dinî mesnet bulmak mümkündür: Ashâb-ı Kehf ve Hz. Süleyman'ın yanındaki kişi."},{"u":6,"q":"Telepati gibi önsezilere mutlak olarak güvenilmemesinin sebebi nedir?","a":["Bu ilham meleklerden olabileceği gibi şeytanın telkinlerinden de kaynaklanabilir.","Kur'an'da telepati yasaklanmıştır.","Telepati yalnızca kâhinlerde görülür.","Telepati bilimsel olarak ispatlanmamıştır."],"x":"İnsandaki önsezi meleklerden de şeytanın telkinlerinden de kaynaklanabilir; her zaman doğru olacağının garantisi yoktur."},{"u":6,"q":"Hz. Peygamber'e (s.a.v.) özgü \"resûlü's-sakaleyn\" unvanı ne anlama gelir?","a":["Cinlerin ve insanların peygamberi","İki âlemin efendisi","Son peygamber","Meleklerin ve insanların elçisi"],"x":"Hz. Peygamber hem insanların hem cinlerin peygamberi olduğu için kendisine \"resûlü's-sakaleyn\" unvanı verilmiştir; bu ona özgüdür."},{"u":6,"q":"Ehl-i sünnete göre cinler görülebilir mi?","a":["Evet; görülebilmenin yegâne şartı var olmaktır.","Hayır; latif varlıklar hiçbir şekilde görülemez.","Yalnızca peygamberler görebilir.","Yalnızca rüyada görülebilir."],"x":"Ehl-i sünnete göre görülebilmenin yegâne şartı \"vücut\" (var olmak)tır; cinler de var olduğuna göre görülebilmeleri mümkündür."},{"u":6,"q":"Cinlerin varlığı hangi delillerle sabittir?","a":["Kur'an, Sünnet ve İcmâ","Yalnızca Kur'an","Kıyas ve akıl","Keşif ve ilham"],"x":"Cinlerin varlığı Kur'an, Sünnet ve İcmâ ile sabittir; hiçbir Müslüman'ın cinlerin varlığını inkâr etmesi câiz olmaz."},{"u":6,"q":"Cinleri hizmetinde çalıştırdığı rivayet edilen tek peygamber kimdir?","a":["Hz. Süleyman","Hz. Davud","Hz. Musa","Hz. Muhammed (s.a.v.)"],"x":"Hz. Süleyman dışında diğer peygamberlerin cinleri hizmetinde çalıştırdığına dair bir rivayet yoktur."},{"u":6,"q":"Reenkarnasyon inancının kabulü niçin âhiret inancının inkârı anlamına gelir?","a":["Mükâfat ve ceza bedenden bedene geçişte gerçekleştiği için âhirete gerek kalmaz.","Ruhun yaratılmadığını kabul ettiği için","Cinlerin varlığını reddettiği için","Hint dinlerinden geldiği için"],"x":"Reenkarnasyonda süreç bedende başlar ve başka bir bedende biter; mükâfat ve ceza için bir âhirete gerek kalmaz."},{"u":7,"q":"Okültizm genel olarak ne anlama gelir?","a":["Gizli saklı olanın bilgisi","Ruhun bedenden ayrılması","Gök cisimlerinin bilgisi","Enerji aktarımıyla şifa"],"x":"Okültizm genel olarak \"gizli saklı olanın bilgisi\" anlamındadır."},{"u":7,"q":"Hadislerde fala inanıp hayatını ona göre şekillendirenler için ne vurgulanmıştır?","a":["Hz. Peygamber'i inkâr etmiş sayılacakları ve namazlarının kabul edilmeyeceği","Fal bakmanın mekruh olduğu","Falın bazen doğru çıkabileceği","Kahve falının caiz olduğu"],"x":"Fal vb. uygulamalara inanıp hayatını ona göre şekillendirenlerin Hz. Peygamber'i inkâr etmiş sayılacakları ve namazlarının kabul edilmeyeceği hadislerde vurgulanmıştır."},{"u":7,"q":"Kâhin ile medyum arasındaki fark hangisidir?","a":["Kâhin gelecekten, medyum ise ölülerin ruhlarını kaynak göstererek geçmişten haber verir.","Kâhin geçmişten, medyum gelecekten haber verir.","Kâhin yıldızlara, medyum kahve telvesine bakar.","İkisi arasında fark yoktur."],"x":"Kâhin gaybı bildiğini iddia edip gelecekten haber verir; medyum ise ölülerin ruhlarını kaynak göstererek geçmişten haber verir. Günümüzde kâhinlerin yerini medyumlar almıştır."},{"u":7,"q":"Astroloji hangi fal türü olarak adlandırılır?","a":["Yıldız falı","Kahve falı","Kâğıt falı","El falı"],"x":"Astroloji fal türlerinden birisidir ve falın bu çeşidine \"yıldız falı\" denir; burç takibi de bir çeşit faldır ve yasaklanmıştır."},{"u":7,"q":"Sihir ve büyü kavramları arasındaki ilişki nasıldır?","a":["Sihir büyüden daha genel bir kavramdır; büyü bir sihir türüdür.","Büyü sihirden daha genel bir kavramdır.","İkisi tamamen farklı şeylerdir.","Sihir helal, büyü haramdır."],"x":"Türkçede aynı anlamda kullanılsalar da aslında büyü bir sihir türüdür; dolayısıyla sihir büyüden daha geneldir."},{"u":7,"q":"Kelam âlimlerinin çoğunluğunun sihir hakkındaki görüşü nedir?","a":["Yasaklanmış olsa da bir gerçekliği ve insanlar üzerinde etkisi olabilir.","Hiçbir gerçekliği yoktur, sadece göz boyamadır.","Gerçekliği vardır ve caizdir.","Yalnızca cinlerin yardımıyla yapılırsa gerçektir."],"x":"Kelam âlimlerinin çoğu sihrin yasak olmakla birlikte bir gerçekliği ve etkisi olabileceğini kabul eder; bazıları ise onu göz boyama, yalan ve hileden ibaret görür."},{"u":7,"q":"Yoganın babası olarak zikredilen kişi ve yoganın doğum yeri hangisidir?","a":["Patanjali – Hindistan","Mikao Usui – J <script>
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’'ʿʾ‘`"]/g, '').replace(/ı/g, 'i').replace(/[^a-z0-9؀-ۿ ]/g, ' ').replace(/\s+/g, ' ').trim();
const strip = h => String(h).replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
const plain = s => String(s).replace(/\*\*/g, '').replace(/[«»]/g, '').replace(/\[\[|\]\]/g, '');
// Metin biçimi: **kalın**, «Arapça»
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/«([^»]+)»/g, (m, a) => /[؀-ۿ]/.test(a) ? `<span class="ar" dir="rtl" lang="ar">${a}</span>` : `«${a}»`)
    .replace(/\[\[(.+?)\]\]/g, '<span class="ek" title="Ek · onay bekliyor">$1</span>');
}

/* ---------- kalıcı durum (tarayıcıda, ön ek: gi_) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('gi_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gi_' + k, JSON.stringify(v)); } catch (e) {} }
};
let stats = store.get('stats', {});   // anahtar -> {ok, bad}
let boxes = store.get('boxes', {});   // tanım id -> kutu 1..5
let oral  = store.get('oral', {});    // bölüm anahtarı -> 1/0

function record(key, ok) { const s = stats[key] || {ok: 0, bad: 0}; ok ? s.ok++ : s.bad++; stats[key] = s; store.set('stats', stats); ozet(true); }
/* ---------- Giray Akademi özeti (alt çubuk · Karnem) ---------- */
const YAD = {home: 'Ana sayfa', study: 'Üniteler', quiz: 'Test', match: 'Kişi eşleştirme', flash: 'Kavram kartları', oralView: 'Konu tekrarı', review: 'Hızlı tekrar', exam: 'Geçmiş sınav soruları', browse: 'Sözlük', progress: 'İlerlemem'};
function yer() {
  const v = curView, a = curArg;
  if (v === 'unitView') return {ad: (a + 1) + '. ünite', url: '/guncel_inanc/#unitView-' + a};
  if (v === 'quiz' && a && a.unit !== undefined && a.unit !== null) return {ad: (a.unit + 1) + '. ünite testi', url: '/guncel_inanc/#unitView-' + a.unit};
  if (v === 'quiz' || v === 'home') return {ad: YAD[v], url: '/guncel_inanc/'};
  return {ad: YAD[v] || 'Ana sayfa', url: '/guncel_inanc/#' + v};
}
function ozet(aktif) {
  if (typeof gaOzet !== 'function') return;
  const tot = Object.values(stats).reduce((a, s) => ({ok: a.ok + s.ok, bad: a.bad + s.bad}), {ok: 0, bad: 0});
  const n = UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;
  gaOzet({bitti: n / UNITELER.length, etiket: n + '/' + UNITELER.length + ' ünite', d: tot.ok, y: tot.bad, kart: Object.values(boxes).filter(b => b >= 4).length, yer: yer(), aktif: !!aktif});
}
function alt(b) { if (typeof gaAltGizle === 'function') gaAltGizle(b); }

/* ---------- veri hazırlığı ---------- */
const TANIM = [], BOLUM = [];

  BOLUM.push({u: ui, s: si, h: s.h});
  s.b.forEach(b => {
    if (b.k === 'd') TANIM.push({id: TANIM.length, u: ui, s: si, t: b.t, x: b.x});
    // İki sütunlu "… | Tanım/Anlamı" tabloları da kavram kartı olur
    if (b.k === 'tbl' && b.r[0].length === 2 && /^(Tanım|Anlamı)$/.test(b.r[0][1])) b.r.slice(1).forEach(r => TANIM.push({id: TANIM.length, u: ui, s: si, t: r[0].replace(/\*\*/g, '').replace(/^\d+\.\s*/, ''), x: r[1]}));

const eserSay = {}; ESER.forEach(r => { const k = norm(r.e); (eserSay[k] ||= new Set()).add(norm(r.m)); });
const ESER_Q = ESER.filter(r => eserSay[norm(r.e)].size === 1 && !/[,;]/.test(r.e)).filter((r, i, a) => a.findIndex(x => norm(x.e) === norm(r.e)) === i);
ESER_Q.forEach((r, i) => r.id = i);
const GECME = 4;

    <div class="actions" style="justify-content:center">
      ${keys.length ? `<button class="btn sec" onclick='quiz({keys:${JSON.stringify(keys)}})'>Yanlışları tekrar et</button>` : ''}
      <button class="btn" onclick="quiz()">Yeni test</button>
    </div>
  </div>`;
}

/* ---------- eşleştirme ---------- */
let M = null;
function match() {
  const list = [], mu = new Set();
  for (const r of shuffle(ESER_Q)) { const k = norm(r.m); if (!mu.has(k)) { mu.add(k); list.push(r); } if (list.length === 5) break; }
  M = {list, left: shuffle(list), right: shuffle(list), sel: null, done: new Set(), hata: 0, t0: Date.now()};
  renderM();
}
function renderM() {
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * M.done.size / M.list.length}%"></i></div><span class="count">${M.done.size} / ${M.list.length} · ${M.hata} hata</span></div>
  <p class="lead" style="margin-bottom:12px">Soldan bir ifade seç, sonra sağdan ilgili kişiye dokun.</p>
  <div class="match">
    <div class="col"><h4>Görüş / akım</h4>${M.left.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : M.sel === r.id ? 'sel' : ''}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mSel(${r.id})">${fmt(r.e)}</button>`).join('')}</div>
    <div class="col"><h4>Kişi</h4>${M.right.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : ''}" id="mr-${r.id}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mPick(${r.id})">${fmt(r.m)}</button>`).join('')}</div>
  </div>`;
}
function mSel(id) { M.sel = id; renderM(); }
function mPick(id) {
  if (M.sel === null) return;
  if (M.sel === id) { M.done.add(id); record('e:' + id, true); M.sel = null; renderM(); if (M.done.size === M.list.length) mEnd(); }
  else { M.hata++; record('e:' + M.sel, false); const el = $('#mr-' + id); el.classList.add('wrong'); setTimeout(() => { el.classList.remove('wrong'); $('#app .bar .count').textContent = `${M.done.size} / ${M.list.length} · ${M.hata} hata`; }, 320); }
}
function mEnd() {
  const sn = Math.round((Date.now() - M.t0) / 1000);
  $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">✓</div><p class="lead">${sn} saniyede, ${M.hata} hatayla bitirdin.</p>
  <div class="list" style="text-align:left;margin-top:18px">${M.list.map(r => `<div class="row"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)} · <span style="color:var(--muted)">Ünite ${r.u + 1}</span></div></div>`).join('')}</div>
  <div class="actions" style="justify-content:center"><button class="btn" onclick="match()">Yeni tur</button></div></div>`;
}

/* ---------- kavram kartları (Leitner) ---------- */
let F = null;
function flash(u) {
  const fu = (u === undefined || u === null) ? store.get('flashU', -1) : u;
  store.set('flashU', fu);
  const list = fu >= 0 ? TANIM.filter(d => d.u === fu) : TANIM;
  const sirali = shuffle(list).sort((a, b) => (boxes[a.id] || 0) - (boxes[b.id] || 0)).slice(0, 20);
  F = {list: shuffle(sirali), i: 0, bildim: 0, u: fu};
  renderF();
}
function unitSelect(cur, fn) {
  return `<select class="select" onchange="${fn}(+this.value)"><option value="-1">Bütün üniteler</option>${UNITELER.map((u, i) => `<option value="${i}" ${cur === i ? 'selected' : ''}>${i + 1}. ${esc(u.t)}</option>`).join('')}</select>`;
}
function renderF() {
  const d = F.list[F.i], kutu = boxes[d.id] || 0;
  $('#app').innerHTML = `
  <div class="rowctl">${unitSelect(F.u, 'flash')}</div>
  <div class="bar"><div class="progress"><i style="width:${100 * F.i / F.list.length}%"></i></div><span class="count">${F.i + 1} / ${F.list.length}</span></div>
  <div class="flash" onclick="this.classList.toggle('flip')"><div class="flash-in">
    <div class="face"><span class="tag">Ünite ${d.u + 1}</span><div class="t">${fmt(d.t)}</div><div class="s" style="color:var(--muted)">Tanımı nedir?</div><div class="hint">Çevirmek için dokun · kutu ${kutu}/5</div></div>
    <div class="face back"><div class="t" style="font-size:1.15rem">${fmt(d.t)}</div><div class="s">${fmt(d.x)}</div></div>
  </div></div>
  <div class="actions" style="justify-content:center">
    <button class="btn red" onclick="fAns(false)">Bilemedim</button>
    <button class="btn" onclick="fAns(true)">Bildim</button>
  </div>
  <div style="text-align:center;margin-top:10px">${bldButton('d:' + d.id, 'Kavram kartı · Ünite ' + (d.u + 1) + ' · ' + UNITELER[d.u].s[d.s].h, plain(d.t) + ': ' + plain(d.x))}</div>`;
}
function fAns(ok) {
  const d = F.list[F.i];
  boxes[d.id] = ok ? Math.min((boxes[d.id] || 0) + 1, 5) : 1; store.set('boxes', boxes); ozet(true);
  record('d:' + d.id, ok); if (ok) F.bildim++;
  F.i++;
  if (F.i < F.list.length) renderF();
  else $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">${F.bildim}/${F.list.length}</div><p class="lead">Deste bitti. Bilemediklerin bir sonraki destede önce gelecek.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="flash()">Yeni deste</button></div></div>`;
}

/* ---------- konu tekrarı ---------- */
let O = null;
const bKey = b => b.u + '-' + b.s;
function oralView(u) {
  const fu = (u === undefined || u === null) ? store.get('oralU', -1) : u;
  store.set('oralU', fu);
  const list = BOLUM.filter(b => (fu < 0 || b.u === fu) && UNITELER[b.u].s[b.s].b.length >= 2);
  const sirali = shuffle(list).sort((a, b) => (oral[bKey(a)] ?? -1) - (oral[bKey(b)] ?? -1));
  O = {list: sirali.slice(0, 10), i: 0, u: fu};
  renderO();
}
function renderO() {
  const b = O.list[O.i], d = oral[bKey(b)], s = UNITELER[b.u].s[b.s];
  $('#app').innerHTML = `
  <div class="rowctl">${unitSelect(O.u, 'oralView')}</div>
  <div class="bar"><div class="progress"><i style="width:${100 * O.i / O.list.length}%"></i></div><span class="count">${O.i + 1} / ${O.list.length}</span></div>
  <div class="card">
    <div class="cardhead"><span class="tag">Ünite ${b.u + 1} · ${esc(UNITELER[b.u].t)}${d === 1 ? ' · daha önce bildin' : d === 0 ? ' · daha önce bilemedin' : ''}</span>${bldButton('b:' + b.u + '-' + b.s, 'Konu tekrarı · Ünite ' + (b.u + 1) + ' · ' + UNITELER[b.u].t, s.h)}</div>
    <div class="q">${fmt(s.h)}</div>
    <p class="lead" id="think" style="font-size:.9rem">Bu bölümde neler olduğunu önce kendin anlat (tanım, maddeler, kişiler), sonra içeriği aç.</p>
    <div class="answer lesson" id="ans">${s.b.map(blockHTML).join('')}</div>
    <div class="actions" id="oa"><button class="btn" onclick="showAns()">İçeriği göster</button></div>
  </div>`;
}
function showAns() {
  $('#ans').classList.add('show'); $('#think').classList.add('hide');
  $('#oa').innerHTML = `<button class="btn red" onclick="oAns(0)">Bilemedim</button><button class="btn" onclick="oAns(1)">Bildim</button>`;
}
function oAns(v) {
  oral[bKey(O.list[O.i])] = v; store.set('oral', oral); O.i++;
  if (O.i < O.list.length) renderO();
  else $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">✓</div><p class="lead">Bu turdaki ${O.list.length} bölümü bitirdin.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="oralView()">Yeni tur</button></div></div>`;
}

/* ---------- hızlı tekrar ---------- */
function review(u) {
  const fu = (u === undefined || u === null) ? store.get('reviewU', -1) : u;
  store.set('reviewU', fu);
  const list = UNITELER.map((x, i) => i).filter(i => fu < 0 || i === fu);
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Hızlı tekrar</h2>
  <p class="lead">Her ünitenin en önemli maddeleri. Bir maddenin yanındaki › ile o bölüme gidebilirsin.</p>
  <div class="rowctl">${unitSelect(fu, 'review')}</div>
  ${list.map(i => `<div class="htu"><div class="htt"><span class="no">${i + 1}</span>${esc(UNITELER[i].t)}</div>${htHTML(i, true)}</div>`).join('')}`;
}

/* ---------- geçmiş sınav soruları ---------- */
function exam() {
  let k = 0;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Geçmiş sınav soruları</h2>
  <p class="lead">Önce kendin cevapla, sonra <b>Cevabı göster</b>'e dokun. Cevaplar ünitelerdeki bilgilere dayanır; altındaki bağlantılar ilgili bölümü açar.</p>
  ${SINAV.map((g, gi) => `<div class="section-title">${esc(g.t)}</div>${g.q.map((q, qi) => { k++; const id = 'x' + gi + '-' + qi; return `<div class="exq"><div class="qq"><span class="no">${qi + 1}</span><span>${fmt(q.q)}</span>${bldButton('x:' + (gi + 1) + '-' + (qi + 1), 'Geçmiş sınav soruları · ' + g.t, plain(q.q))}</div>
    <div class="actions" style="justify-content:flex-start;margin-top:10px" id="${id}b"><button class="btn sec" onclick="exShow('${id}')">Cevabı göster</button></div>
    <div class="exa hide" id="${id}"><div class="exl">Cevap</div>${q.x.map(x => `<p>${fmt(x)}</p>`).join('')}${q.n ? `<div class="box bk" style="margin-top:8px"><b class="lb">Not</b>${fmt(q.n)}</div>` : ''}
    ${q.r.length ? `<div class="links">${q.r.map(([u, s]) => `<button onclick="toSection(${u},${s})">Ü${u + 1} · ${esc(UNITELER[u].s[s].h)}</button>`).join('')}</div>` : ''}</div></div>`; }).join('')}`).join('')}`;
}
function exShow(id) { $('#' + id).classList.remove('hide'); $('#' + id + 'b').classList.add('hide'); }
function toSection(u, s) { pendingFocus = {id: `ls-${u}-${s}`}; go('unitView', u); }

/* ---------- sözlük ---------- */
let bTab = 'kavram';
function browse() {
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Kavram ve kişi sözlüğü</h2>
  <div class="rowctl" style="margin:12px 0 10px">
    <button class="btn ${bTab === 'kavram' ? '' : 'sec'}" onclick="bTab='kavram';browse()">Kavramlar (${TANIM.length})</button>
    <button class="btn ${bTab === 'eser' ? '' : 'sec'}" onclick="bTab='eser';browse()">Kişiler (${ESER.length})</button>
  </div>
  <input class="search" id="bq" type="search" placeholder="${bTab === 'kavram' ? 'Kavram ya da tanımda ara…' : 'Kişi ya da görüş ara…'}" oninput="doBrowse()">
  <div class="list" id="bl"></div>`;
  doBrowse();
}
function doBrowse() {
  const t = norm($('#bq').value || '');
  const src = bTab === 'kavram' ? TANIM : ESER;
  const hits = src.filter(r => !t || norm(bTab === 'kavram' ? r.t + ' ' + r.x : r.e + ' ' + r.m).includes(t));
  $('#bl').innerHTML = hits.length ? hits.map(r => bTab === 'kavram'
    ? `<button class="row" onclick="toSection(${r.u},${r.s})"><div class="e">${fmt(r.t)}</div><div class="n">${fmt(r.x)}</div><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].s[r.s].h)}</div></button>`
    : `<button class="row" onclick="toSection(${r.u},${r.s})"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)}${r.not ? ` <span style="color:var(--muted)">(${fmt(r.not)})</span>` : ''}</div><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].s[r.s].h)}</div></button>`).join('')
    : '<p class="empty">Sonuç yok.</p>';
}

/* ---------- ilerleme ---------- */
function progress() {
  const satir = UNITELER.map((u, i) => {
    let ok = 0, bad = 0; unitItems(i).forEach(x => { const s = stats[x.key]; if (s) { ok += s.ok; bad += s.bad; } });
    const p = ok + bad ? Math.round(100 * ok / (ok + bad)) : null;
    return `<div class="meter"><span title="${esc(u.t)}">${i + 1}. ${esc(u.t)}</span><div class="progress"><i style="width:${p ?? 0}%;background:${p === null ? 'transparent' : p >= 70 ? 'var(--green-2)' : p >= 45 ? 'var(--gold)' : 'var(--red)'}"></i></div><span class="count">${p === null ? '—' : '%' + p}</span></div>`;
  }).join('');
  const byKey = {}; HAVUZ.forEach(x => byKey[x.key] = x);
  const zayif = Object.entries(stats).filter(([k, s]) => s.bad > 0 && byKey[k]).sort((a, b) => (b[1].bad - b[1].ok * .5) - (a[1].bad - a[1].ok * .5)).slice(0, 12).map(([k]) => k);
  const etiket = k => { const [t, id] = k.split(':');
    if (t === 'd') return `<b>${fmt(TANIM[id].t)}</b>: ${fmt(TANIM[id].x)}`;
    if (t === 'e') return `<b>${fmt(ESER_Q[id].e)}</b> → ${fmt(ESER_Q[id].m)}`;
    return `${fmt(SORULAR[id].q)} <b>${fmt(SORULAR[id].a[0])}</b>`; };
  const oralN = Object.keys(oral).length, oralOk = Object.values(oral).filter(v => v === 1).length;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">İlerlemem</h2>
  <div class="card" style="margin-top:14px">${satir}
    <p class="lead" style="font-size:.88rem;margin-top:12px">Çalış bölümü: ${uDone()} / ${UNITELER.length} ünite tamamlandı.<br>Konu tekrarı: ${oralN} bölüm çalışıldı, ${oralOk} tanesini bildin.</p></div>
  <div class="section-title">En çok karıştırdıkların</div>
  ${zayif.length ? `<div class="list">${zayif.map(k => `<div class="row"><div class="n">${etiket(k)}</div></div>`).join('')}</div>
    <div class="actions"><button class="btn" onclick='quiz({keys:${JSON.stringify(zayif)}})'>Bunlarla test çöz</button></div>` : '<p class="empty">Henüz yanlış yok. Biraz test çözünce burada görünecek.</p>'}
  <div class="actions" style="margin-top:30px"><button class="btn sec" onclick="sifirla()">İlerlemeyi sıfırla</button></div>`;
}
function sifirla() {
  if (!confirm('Bütün ilerleme kaydın silinsin mi?')) return;
  stats = {}; boxes = {}; oral = {}; uStat = {};
  store.set('stats', stats); store.set('boxes', boxes); store.set('oral', oral); store.set('units', uStat); progress();
}

/* ---------- genel arama ---------- */
let SIDX = null;
function bTxt(b) {
  if (b.k === 'tbl') return b.r.map(r => r.filter(Boolean).map(plain).join(' – ')).join(' · ');
  if (b.k === 'steps') return b.x.map(plain).join(' · ');
  if (b.k === 'ar') return plain(b.x || '');
  if (b.k === 'sc') return plain(b.q + ' ' + b.x);
  return plain((b.t ? b.t + ': ' : '') + b.x);
}
function buildIndex() {
  SIDX = [];
  UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
    SIDX.push({u: ui, s: si, kind: 'b', t: s.h, x: s.b.map(bTxt).join(' · ')});
  }));
}
function openSearch() {
  if (!SIDX) buildIndex();
  $('#sov').classList.add('open');
  try { history.pushState(Object.assign({}, history.state, {search: true}), ''); } catch (e) {}
  $('#sq').value = ''; doGlobalSearch(); setTimeout(() => $('#sq').focus(), 30);
}
function closeSearch(viaPop) {
  $('#sov').classList.remove('open');
  if (!viaPop && history.state && history.state.search) { try { history.back(); } catch (e) {} }
}
function markText(text, t) {
  const n = norm(text); const i = n.indexOf(t);
  if (!t || i < 0) return esc(text.slice(0, 160)) + (text.length > 160 ? '…' : '');
  // norm uzunluğu yaklaşık korunduğundan konuma yakın bir pencere al
  const a = Math.max(0, i - 60), b = Math.min(text.length, i + t.length + 100);
  return (a ? '…' : '') + esc(text.slice(a, b)) + (b < text.length ? '…' : '');
}
function doGlobalSearch() {
  const t = norm($('#sq').value || '');
  if (t.length < 2) { $('#sres').innerHTML = '<p class="empty">En az iki harf yaz.</p>'; return; }
  const kav = TANIM.filter(d => norm(d.t).includes(t)).slice(0, 12);
  const bol = SIDX.filter(r => norm(r.t + ' ' + r.x).includes(t)).slice(0, 30);
  $('#sres').innerHTML = (kav.length ? `<div class="sgrp">Kavramlar</div>${kav.map(d => `<button class="sitem" onclick="hit(${d.u},${d.s})"><div class="w">Ünite ${d.u + 1}</div><div class="t">${fmt(d.t)}</div><div class="x">${esc(plain(d.x).slice(0, 140))}</div></button>`).join('')}` : '')
    + (bol.length ? `<div class="sgrp">Konu anlatımları</div>${bol.map(r => `<button class="sitem" onclick="hit(${r.u},${r.s})"><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].t)}</div><div class="t">${esc(r.t)}</div><div class="x">${markText(r.x, t)}</div></button>`).join('')}` : '')
    || '<p class="empty">Sonuç yok.</p>';
}
function hit(u, s) { $('#sov').classList.remove('open'); pendingFocus = {id: `ls-${u}-${s}`}; if (history.state && history.state.search) { try { history.replaceState({view: curView, arg: curArg, d: (history.state.d || 0)}, ''); } catch (e) {} } go('unitView', u); }
function focusHit(f) { jump(f.id); }

/* ---------- başlat ---------- */
const ilkHash = (location.hash || '').slice(1);
try { history.replaceState({view: 'home', arg: null, d: 0}, '', location.pathname + location.search); } catch (e) {}
render('home');
// Alt çubuktaki "Devam et" / "Dersler" bağlantısıyla gelindiyse kaldığı yere aç (ör. #unitView-7)
(function () {
  const h = ilkHash; if (!h) return;
  const m = h.match(/^(\w+?)(?:-(\d+))?$/); if (!m) return;
  const v = m[1], a = m[2] === undefined ? undefined : +m[2];
  if (!['study', 'unitView', 'match', 'flash', 'oralView', 'review', 'exam', 'browse', 'progress'].includes(v)) return;
  if (v === 'unitView' && !(a >= 0 && a < UNITELER.length)) return;
  if (v === 'unitView') { go('study'); go('unitView', a); } else go(v);
})();
</script>
</body>
</html>
